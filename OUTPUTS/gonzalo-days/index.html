<title>Gonzalo's Days</title>
<meta name="description" content="Gonzalo's shared baby log: feeds, sleep, diapers, WHO growth percentiles, a week-by-week guide and his vaccine calendar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Gonzalo's Days — stylesheet
   Tokens first (light), then dark under both the OS media query
   and the explicit data-theme stamp.
   ============================================================ */
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --card-2:#F7F8F6; --card-3:#EEF1F0;
  --ink:#1A2030; --ink-2:#4B5566; --ink-3:#7B8593;
  --rule:#DFE3E5; --rule-2:#ECEFF0;
  --accent:#1F2A44; --accent-ink:#FFFFFF; --link:#2A5FB3; --focus:#2A5FB3;
  --sleep:#5B4FCF; --sleep-soft:#ECEAFB; --sleep-ink:#3F35A8;
  --feed:#CF7A12;  --feed-soft:#FBEEDD;  --feed-ink:#8F5208;
  --diaper:#178F6C;--diaper-soft:#DDF3EB;--diaper-ink:#0F6B50;
  --care:#6B7480;  --care-soft:#EBEEF1;  --care-ink:#4B5566;
  --good:#1B7F3B; --good-soft:#DFF2E5;
  --warn:#8A5A00; --warn-soft:#F8ECCF;
  --bad:#B3261E;  --bad-soft:#F9E1DF;
  --sun:#E9A31A;
  --shadow:0 1px 2px rgba(26,32,48,.05),0 10px 30px -18px rgba(26,32,48,.25);
  --shadow-lg:0 2px 6px rgba(26,32,48,.08),0 24px 60px -24px rgba(26,32,48,.35);
  --r:16px; --r-s:10px; --r-xs:7px;
  --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --card:#171D25; --card-2:#1D242E; --card-3:#232B36;
    --ink:#E9EDF2; --ink-2:#AAB4C0; --ink-3:#7E8896;
    --rule:#2A333E; --rule-2:#222A34;
    --accent:#E9EDF2; --accent-ink:#0F1419; --link:#8AB4F8; --focus:#8AB4F8;
    --sleep:#7D74E6; --sleep-soft:#26243F; --sleep-ink:#B4AEF5;
    --feed:#C98126;  --feed-soft:#3A2A14;  --feed-ink:#EBB264;
    --diaper:#2AA07C;--diaper-soft:#12302A;--diaper-ink:#6FD1B0;
    --care:#8A94A1;  --care-soft:#242B34;  --care-ink:#B9C2CC;
    --good:#5FCB84; --good-soft:#15301F;
    --warn:#E5B95C; --warn-soft:#33290F;
    --bad:#F08A83;  --bad-soft:#3A1917;
    --sun:#F2B63C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --card:#171D25; --card-2:#1D242E; --card-3:#232B36;
  --ink:#E9EDF2; --ink-2:#AAB4C0; --ink-3:#7E8896;
  --rule:#2A333E; --rule-2:#222A34;
  --accent:#E9EDF2; --accent-ink:#0F1419; --link:#8AB4F8; --focus:#8AB4F8;
  --sleep:#7D74E6; --sleep-soft:#26243F; --sleep-ink:#B4AEF5;
  --feed:#C98126;  --feed-soft:#3A2A14;  --feed-ink:#EBB264;
  --diaper:#2AA07C;--diaper-soft:#12302A;--diaper-ink:#6FD1B0;
  --care:#8A94A1;  --care-soft:#242B34;  --care-ink:#B9C2CC;
  --good:#5FCB84; --good-soft:#15301F;
  --warn:#E5B95C; --warn-soft:#33290F;
  --bad:#F08A83;  --bad-soft:#3A1917;
  --sun:#F2B63C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Figtree,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--link);text-underline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.mono{font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
.serif{font-family:Fraunces,Georgia,"Times New Roman",serif}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{max-width:1060px;margin:0 auto;padding:0 14px}
header.top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px 0 10px;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{
  font-family:Fraunces,Georgia,serif;font-weight:600;font-size:30px;letter-spacing:-.02em;
  font-variation-settings:"opsz" 30,"SOFT" 60;line-height:1;
}
.brand .age{font-size:13.5px;color:var(--ink-2)}
.brand .age b{color:var(--ink);font-weight:600}
.topctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chipbtn{
  appearance:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;
  padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  color:var(--ink-2);white-space:nowrap
}
.chipbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.chipbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.chipbtn .dot.live{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.chipbtn .dot.local{background:var(--warn)}
.langtog{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--card)}
.langtog button{appearance:none;border:0;background:none;padding:6px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--ink-3)}
.langtog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* nav */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .inner{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{
  appearance:none;border:0;background:none;height:var(--nav-h);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.01em
}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{stroke:var(--ink)}
nav.tabs button .ico{width:40px;height:26px;border-radius:13px;display:grid;place-items:center}
nav.tabs button[aria-selected="true"] .ico{background:var(--card-3)}

main{padding-top:4px}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-bottom:20px}
.panel>*{min-width:0}
.panel[hidden]{display:none}

/* ---------- generic blocks ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.card h3{font-size:14px;font-weight:700}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cardhead .sub{color:var(--ink-3);font-size:12.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:grid;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--card-3);color:var(--ink-2);white-space:nowrap}
.pill.sleep{background:var(--sleep-soft);color:var(--sleep-ink)}
.pill.feed{background:var(--feed-soft);color:var(--feed-ink)}
.pill.diaper{background:var(--diaper-soft);color:var(--diaper-ink)}
.pill.care{background:var(--care-soft);color:var(--care-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 var(--r-xs) var(--r-xs) 0;font-size:13.5px}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.note.good{border-left-color:var(--good);background:var(--good-soft)}
.note.info{border-left-color:var(--link);background:var(--card-2)}
.note b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.btn{
  appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:var(--r-s);padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--link)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--rule);background:var(--card-2);border-radius:var(--r-s);
  padding:10px 11px;font-size:16px;min-height:44px
}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-s);overflow:hidden;background:var(--card-2)}
.seg button{appearance:none;border:0;background:none;padding:9px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;border:1px solid var(--rule);border-radius:var(--r-s);overflow:hidden;background:var(--card-2)}
.stepper button{appearance:none;border:0;background:var(--card-3);font-size:20px;cursor:pointer;min-height:44px}
.stepper input{border:0;background:none;text-align:center;font-size:18px;font-weight:700;min-height:44px;width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{appearance:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.presets button:hover{border-color:var(--ink-3)}

/* ---------- Today: now strip ---------- */
.now{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.now .tile{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px 14px 12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;gap:3px
}
.now .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--care)}
.now .tile.feed::before{background:var(--feed)}
.now .tile.sleep::before{background:var(--sleep)}
.now .tile.diaper::before{background:var(--diaper)}
.now .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.now .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.now .v small{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.now .d{font-size:12.5px;color:var(--ink-2);margin-top:auto}
.now .d.hint{color:var(--ink-3)}
.now .tile.live .v{color:var(--sleep-ink)}

/* ---------- action grid ---------- */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.act{
  appearance:none;border:1px solid var(--rule);background:var(--card);border-radius:var(--r);
  min-height:76px;padding:10px 8px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  box-shadow:var(--shadow);position:relative;transition:transform .08s ease;
}
.act:active{transform:scale(.97)}
.act .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--care-soft);color:var(--care-ink)}
.act .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act.feed .ico{background:var(--feed-soft);color:var(--feed-ink)}
.act.sleep .ico{background:var(--sleep-soft);color:var(--sleep-ink)}
.act.diaper .ico{background:var(--diaper-soft);color:var(--diaper-ink)}
.act .lb{font-size:12.5px;font-weight:700;letter-spacing:-.005em;text-align:center;line-height:1.15}
.act .sub{font-size:11px;color:var(--ink-3);text-align:center}
.act.running{border-color:var(--sleep);background:var(--sleep-soft)}
.act.running.feed{border-color:var(--feed);background:var(--feed-soft)}
.act.running .ico{background:var(--card)}
.act.running .lb{font-family:"DM Mono",ui-monospace,monospace;font-size:15px;letter-spacing:0}
.act.running::after{
  content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--sleep);
  animation:pulse 1.4s ease-in-out infinite
}
.act.running.feed::after{background:var(--feed)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){.act.running::after{animation:none}}

/* ---------- totals ---------- */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--care)}
.stat.feed .k i{background:var(--feed)}
.stat.sleep .k i{background:var(--sleep)}
.stat.diaper .k i{background:var(--diaper)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:5px 0 2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.stat .d{font-size:12.5px;color:var(--ink-2)}
.stat .d.hint{color:var(--ink-3)}

/* ---------- ribbon (24h) ---------- */
.ribbon{position:relative}
.ribbon svg{width:100%;height:74px;display:block;overflow:visible}
.ribbon .axis text{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;fill:var(--ink-3)}
.ribbon .axis line{stroke:var(--rule);stroke-width:1}
.ribbon .track{fill:var(--card-2)}
.ribbon .sl{fill:var(--sleep)}
.ribbon .sl.run{opacity:.55}
.ribbon .fd{fill:var(--feed)}
.ribbon .dp{fill:var(--diaper)}
.ribbon .cr{fill:var(--care)}
.ribbon .now{stroke:var(--ink);stroke-width:1.5}
.ribbon .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .sleep i{background:var(--sleep)}.legend .feed i{background:var(--feed)}.legend .diaper i{background:var(--diaper)}.legend .care i{background:var(--care)}
.tip{
  position:absolute;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);
  padding:6px 9px;border-radius:8px;font-size:12px;line-height:1.35;box-shadow:var(--shadow-lg);white-space:nowrap;
  transform:translate(-50%,calc(-100% - 8px));
}
.tip b{font-weight:700}

/* ---------- entries list ---------- */
.entries{display:grid;gap:6px}
.entry{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-s);padding:9px 12px;cursor:pointer;
}
.entry:hover{border-color:var(--ink-3)}
.entry .t{font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.entry .m{min-width:0}
.entry .m b{font-weight:700;font-size:14px}
.entry .m span{color:var(--ink-2);font-size:13px}
.entry .m .n{color:var(--ink-3);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .who{font-size:11px;color:var(--ink-3);white-space:nowrap}
.entry .bar{width:4px;height:100%;min-height:28px;border-radius:2px;background:var(--care);justify-self:start}
.entry.feed .bar{background:var(--feed)}.entry.sleep .bar{background:var(--sleep)}.entry.diaper .bar{background:var(--diaper)}
.entry .lead{display:flex;align-items:center;gap:8px}
.entry.running{border-color:var(--sleep)}
.entry.running.feed{border-color:var(--feed)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-size:17px}
.daynav .btn{min-width:40px}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:14px;border:1px dashed var(--rule);border-radius:var(--r)}

/* ---------- sheet (modal) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);display:grid;gap:12px
}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 2px}
.sheet h2{font-size:18px;font-weight:700}
.sheet .actionsrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.sheet .actionsrow .left{margin-right:auto}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:50;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);max-width:92vw
}
.toast button{appearance:none;border:0;background:none;color:var(--sun);font-weight:700;cursor:pointer;padding:0}

/* ---------- growth ---------- */
.gtabs{display:flex;gap:6px;flex-wrap:wrap}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--rule-2);stroke-width:1}
.chart .axis text{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;fill:var(--ink-3)}
.chart .axis line{stroke:var(--rule);stroke-width:1}
.chart .pct{fill:none;stroke:var(--ink-3);stroke-width:1;opacity:.55}
.chart .pct.p50{stroke:var(--ink-2);stroke-width:1.4;opacity:.9}
.chart .band{fill:var(--sleep);opacity:.07}
.chart .plab{font-family:"DM Mono",ui-monospace,monospace;font-size:10px;fill:var(--ink-3)}
.chart .me{fill:none;stroke:var(--sleep);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--sleep);stroke:var(--card);stroke-width:2}
.chart .xh{stroke:var(--ink-3);stroke-width:1}
.gform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.gtable{width:100%;border-collapse:collapse;font-size:13.5px}
.gtable th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px;border-bottom:1px solid var(--rule)}
.gtable td{padding:8px;border-bottom:1px solid var(--rule-2);font-variant-numeric:tabular-nums}
.gtable td.num{font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px}
.tblwrap{overflow-x:auto}
.pctbig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pctbig .stat .v{font-size:22px}

/* ---------- guide ---------- */
.guidehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.guidehead h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.015em;font-variation-settings:"opsz" 24,"SOFT" 40}
.agepick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.agepick::-webkit-scrollbar{display:none}
.agepick button{appearance:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.agepick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gsec{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.gsec>div{min-width:0}
.gsec .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--card-3)}
.gsec .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gsec.sleep .ico{background:var(--sleep-soft);color:var(--sleep-ink)}
.gsec.feed .ico{background:var(--feed-soft);color:var(--feed-ink)}
.gsec.diaper .ico{background:var(--diaper-soft);color:var(--diaper-ink)}
.gsec.dev .ico{background:var(--good-soft);color:var(--good)}
.gsec.warn .ico{background:var(--bad-soft);color:var(--bad)}
.gsec h3{font-size:14px;margin-bottom:3px}
.gsec p,.gsec li{color:var(--ink-2);font-size:14px}
.gsec ul{margin:4px 0 0;padding-left:18px}
.gsec li{margin-bottom:3px}
.gsec li::marker{color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;color:var(--ink)}
.milest{display:grid;gap:8px}
.milest .cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.milest label{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink-2);cursor:pointer}
.milest input{margin-top:3px;width:17px;height:17px;accent-color:var(--good);flex:none}
.milest label.on{color:var(--ink-3);text-decoration:line-through}
.src{font-size:12px;color:var(--ink-3);margin-top:8px}
.src a{color:var(--ink-3)}

/* ---------- health ---------- */
.vax{display:grid;gap:8px}
.vaxrow{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r-s);background:var(--card)
}
.vaxrow .when{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:82px}
.vaxrow .what b{font-size:14px;display:block}
.vaxrow .what span{font-size:12.5px;color:var(--ink-3)}
.vaxrow.done{opacity:.6}
.vaxrow.done .what b{text-decoration:line-through}
.vaxrow.due{border-color:var(--warn)}
.vaxrow.over{border-color:var(--bad)}
.vaxgroup{display:grid;gap:8px}
.vaxgroup h3{display:flex;align-items:baseline;gap:8px;font-size:14px}
.vaxgroup h3 span{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--ink-3);font-weight:500}
.check{appearance:none;width:22px;height:22px;border:1.5px solid var(--rule);border-radius:6px;background:var(--card-2);cursor:pointer;display:grid;place-content:center;flex:none}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:10px;height:6px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}

/* ---------- ask ---------- */
.ask textarea{min-height:64px}
.ask .out{white-space:pre-wrap;font-size:14px;line-height:1.5;color:var(--ink);background:var(--card-2);border-radius:var(--r-s);padding:12px;min-height:40px}
.ask .out:empty{display:none}

/* ---------- footer ---------- */
footer{padding:18px 0 10px;color:var(--ink-3);font-size:12.5px;display:grid;gap:6px}

/* ---------- responsive ---------- */
@media (max-width:640px){
  .brand{flex:1 1 100%}
  .brand h1{font-size:26px}
  header.top{padding-top:12px;gap:8px}
  .topctl{width:100%;justify-content:flex-start}
  .now{grid-template-columns:1fr 1fr 1fr;gap:7px}
  .now .tile{padding:11px 10px 10px;min-height:92px}
  .now .v{font-size:19px}
  .now .v small{font-size:12px}
  .now .d{font-size:11.5px}
  .now .k{font-size:10.5px}
  .totals{gap:7px}
  .stat{padding:10px 11px}
  .stat .v{font-size:21px}
  .gform{grid-template-columns:1fr 1fr}
  .pctbig{grid-template-columns:1fr 1fr 1fr;gap:7px}
  .pctbig .stat .v{font-size:17px}
  .app{padding:0 10px}
  .card{padding:14px}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){
  .actions{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:900px){
  body{padding-bottom:20px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--rule);background:var(--bg);margin:0 -14px 8px;padding:0 14px}
  nav.tabs .inner{display:flex;gap:4px}
  nav.tabs button{height:48px;flex-direction:row;gap:8px;padding:0 14px;font-size:13.5px}
  nav.tabs button .ico{width:auto;height:auto;background:none!important}
  nav.tabs button[aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--ink)}
  .toast{bottom:24px}
  .scrim{align-items:center}
  .sheet{border-radius:20px}
}
@media print{nav.tabs,.actions,.topctl{display:none!important}body{background:#fff;color:#000}}

/* ---------- hero (since last feed) ---------- */
.hero{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--feed)}
.hero .num{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:54px;font-weight:500;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:8px}
.hero .num small{font-family:Figtree,sans-serif;font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.hero .sub{margin-top:6px;font-size:15px;color:var(--ink-2)}
.hero .sub b{font-weight:700;color:var(--ink)}
.hero .sub b.L{color:var(--feed-ink)}
.hero .sub b.R{color:var(--sleep-ink)}
.hero .detail{margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.hero.nursing::before{background:var(--feed)}
.hero.nursing .num{color:var(--feed-ink)}
.now.two{grid-template-columns:1fr 1fr}

/* ---------- patterns ---------- */
.patseg{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pat svg{width:100%;height:auto;display:block;overflow:visible}
.pat text{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;fill:var(--ink-3)}
.pat .rowlab{fill:var(--ink-2)}
.pat .night{fill:var(--card-3)}
.pat .rowline{stroke:var(--rule-2);stroke-width:1}
.pat .axis line{stroke:var(--rule);stroke-width:1}
.pat .grid line{stroke:var(--rule-2);stroke-width:1}
.pat .sl{fill:var(--sleep);opacity:.28}
.pat .fd{fill:var(--feed)}
.pat .wt{fill:var(--diaper)}
.pat .dt{fill:var(--dirty)}
.pat .cr{fill:var(--care)}
.pat .bar-f{fill:var(--feed)}
.pat .bar-w{fill:var(--diaper)}
.pat .bar-d{fill:var(--dirty)}
.pat .bar-s{fill:var(--sleep)}
.pat .line{fill:none;stroke:var(--sleep);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pat .pt{fill:var(--sleep);stroke:var(--card);stroke-width:2}
.pat .hit{fill:transparent;cursor:default}
.pat .vlab{fill:var(--ink);font-weight:500}
:root{--dirty:#8B5E34;--dirty-soft:#F1E6DC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dirty:#B08258;--dirty-soft:#33261A}}
:root[data-theme="dark"]{--dirty:#B08258;--dirty-soft:#33261A}
.legend .dirty i{background:var(--dirty)}
.legend .night i{background:var(--card-3);border:1px solid var(--rule)}
.legend .wet i{background:var(--diaper)}
.sidebar{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--card-3);margin:10px 0 6px}
.sidebar .L{background:var(--feed)}
.sidebar .R{background:var(--feed-ink)}
.sidelab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.sidelab b{color:var(--ink)}

/* ---------- doctor ---------- */
.doc dl{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;margin:0;font-size:14px}
.doc dt{color:var(--ink-2);padding:8px 0;border-bottom:1px solid var(--rule-2)}
.doc dd{margin:0;padding:8px 0 8px 12px;border-bottom:1px solid var(--rule-2);text-align:right;font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;color:var(--ink)}
.doc dt:last-of-type,.doc dd:last-of-type{border-bottom:0}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.doc th{text-align:right;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 6px;border-bottom:1px solid var(--rule)}
.doc th:first-child,.doc td:first-child{text-align:left}
.doc td{padding:7px 6px;border-bottom:1px solid var(--rule-2);text-align:right;font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.doc td:first-child{font-family:Figtree,sans-serif;font-size:13.5px}
.doc tr.avg td{border-top:1px solid var(--rule);border-bottom:0;color:var(--feed-ink);font-weight:700}
.doc tr.today td{color:var(--ink-3)}

function bandFor(days){ return GUIDE.find(g => days >= g.from && days <= g.to) || GUIDE[GUIDE.length - 1]; }

/* feed interval hint (hours) by age */
function feedIntervalFor(days){
  if (days < 42) return B('2–3 h', '2–3 h');
  if (days < 120) return B('2–4 h', '2–4 h');
  if (days < 180) return B('3–4 h', '3–4 h');
  if (days < 365) return B('3–5 h', '3–5 h');
  return B('meals + snacks', 'comidas y tentempiés');
}
function feedsPerDayFor(days){
  if (days < 42) return '8–12';
  if (days < 120) return '7–10';
  if (days < 180) return '5–8';
  if (days < 365) return '4–6';
  return '3–5';
}
function sleepHoursFor(days){
  if (days < 120) return '14–17';
  if (days < 365) return '12–16';
  return '11–14';
}

  vol: (ml, u) => u === 'oz' ? (Math.round(ml / OZ_ML * 10) / 10) + ' oz' : Math.round(ml) + ' ml',
  volNum: (ml, u) => u === 'oz' ? Math.round(ml / OZ_ML * 10) / 10 : Math.round(ml),

/* ---------------- prefs (per device) ---------------- */
const prefs = Object.assign({ lang: null, who: null, vol: 'ml', wt: 'kg', len: 'cm', temp: 'F', msDone: {} }, lsGet(LS_PREFS, {}));
if (!prefs.lang) prefs.lang = (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';

/* ---------------- state ---------------- */
const emptyData = () => ({ days: {}, growth: { m: {} }, health: { vax: {}, visits: {}, ped: {}, ms: {} }, profile: { caregivers: ['Jose', 'Minerva'] } });
const state = {
  mode: 'connecting',       // connecting | local | db | readonly
  data: emptyData(),
  db: null, downloads: null, sample: null,
  listeners: [],

};
function onChange(fn){ state.listeners.push(fn); }
function emit(){ for (const fn of state.listeners) { try { fn(); } catch(e){ console.error(e); } } }

/* ---------------- events ---------------- */
/* event: {id, t, sub, s(ms), e(ms|null), a(number|null), u, n, by, c, del} */
function dayEvents(key){
  const d = state.data.days[key];
  if (!d || !d.ev) return [];
  return Object.values(d.ev).filter(e => e && !e.del && typeof e.s === 'number').sort((a, b) => a.s - b.s);
}
function eventsBetween(fromMs, toMs){
  const out = [];
  let k = dayKey(fromMs - 86400000 * 1.5);
  const end = dayKey(toMs);
  for (let i = 0; i < 400; i++){
    for (const e of dayEvents(k)) if (e.s <= toMs && (e.e == null ? e.s : Math.max(e.e, e.s)) >= fromMs) out.push(e);
    if (k >= end) break;

}
function allEvents(){
  const out = [];
  for (const k of Object.keys(state.data.days)) out.push(...dayEvents(k));
  return out.sort((a, b) => a.s - b.s);
}
function runningEvents(){
  const now = Date.now();
  return eventsBetween(now - 86400000 * 1.5, now + 3600000).filter(e => e.e == null && (e.t === 'sleep' || (e.t === 'feed' && (e.sub === 'L' || e.sub === 'R')) || e.t === 'pump'));

}

async function putEvent(ev){

  ev.c = ev.c || Date.now();
  if (!state.data.days[key]) state.data.days[key] = { d: key, ev: {} };

}
async function deleteEvent(ev){
  const key = dayKey(ev.s);
  const cur = Object.assign({}, ev, { del: true });
  if (state.data.days[key] && state.data.days[key].ev) state.data.days[key].ev[ev.id] = cur;
  emit();

}
/* move an event whose start day changed: tombstone old, write new */
async function moveEvent(oldEv, newEv){

}
async function putGrowth(m){ state.data.growth.m[m.id] = m; emit(); await persist('growth/main', 'm', m.id, m); }
async function putHealth(field, id, obj){ state.data.health[field] = state.data.health[field] || {}; state.data.health[field][id] = obj; emit(); await persist('health/main', field, id, obj); }

/* ---------------- persistence ---------------- */
async function persist(path, field, id, obj){
  if (state.mode === 'db' && state.db){
    const ref = state.db.doc(path);
    try {
      await ref.update({ [field]: { [id]: obj } });
    } catch (e) {
      if (e && e.code === 'invalid_argument'){
        try {
          const snap = await ref.get();
          const cur = snap.exists ? clone(snap.data()) : {};
          if (path.indexOf('days/') === 0) cur.d = path.slice(5);
          cur[field] = cur[field] || {};
          cur[field][id] = obj;
          await ref.set(cur);
        } catch (e2) { writeFailed(e2); }
      } else writeFailed(e);
    }
  } else {
    lsSet(LS_DATA, state.data);
  }
}
async function persistDoc(path, obj){
  if (state.mode === 'db' && state.db){
    try { await state.db.doc(path).set(clone(obj)); } catch (e) { writeFailed(e); }
  } else lsSet(LS_DATA, state.data);
}

  console.warn('write failed', e);

/* ---------------- boot: capabilities ---------------- */
function applySnapshotDoc(target, id, data){ target[id] = data; }
async function boot(){
  const hasRuntime = !window.GD_PUBLIC && !!(window.claude && typeof window.claude.use === 'function');

    state.mode = 'local';
    state.data = Object.assign(emptyData(), lsGet(LS_DATA, {}));
    emit();

    return;
  }

  const cached = lsGet(LS_CACHE, null);
  if (cached) { state.data = Object.assign(emptyData(), cached); emit(); }
  const [db, downloads, sample] = await Promise.all([
    window.claude.use('db').catch(() => null),
    window.claude.use('downloads').catch(() => null),
    window.claude.use('sample').catch(() => null),
  ]);
  state.downloads = downloads; state.sample = sample;
  if (!db){
    state.mode = 'local';
    state.data = Object.assign(emptyData(), lsGet(LS_DATA, {}));
    emit();
    return;
  }
  state.db = db; state.mode = 'db';
  state.data = cached ? Object.assign(emptyData(), cached) : emptyData();
  const onErr = e => { console.warn('subscription error', e); if (e && e.code === 'revoked') { state.mode = 'readonly'; emit(); } };

    for (const ch of snap.docChanges()){
      if (ch.type === 'removed') delete state.data.days[ch.doc.id];
      else state.data.days[ch.doc.id] = clone(ch.doc.data());
    }
    cacheWrite(); emit();
  }, onErr);
  db.doc('growth/main').onSnapshot(s => { state.data.growth = s.exists ? clone(s.data()) : { m: {} }; if (!state.data.growth.m) state.data.growth.m = {}; cacheWrite(); emit(); }, onErr);
  db.doc('health/main').onSnapshot(s => { const h = s.exists ? clone(s.data()) : {}; state.data.health = Object.assign({ vax: {}, visits: {}, ped: {}, ms: {} }, h); cacheWrite(); emit(); }, onErr);
  db.doc('profile/main').onSnapshot(s => { if (s.exists) state.data.profile = Object.assign({ caregivers: ['Jose', 'Minerva'] }, clone(s.data())); cacheWrite(); emit(); }, onErr);
  emit();
}
let cacheTimer = null;
function cacheWrite(){ clearTimeout(cacheTimer); cacheTimer = setTimeout(() => lsSet(LS_CACHE, state.data), 400); }

/* merge this device's local log into the shared store (one-off) */
async function mergeLocalIntoShared(){
  const local = lsGet(LS_DATA, null);
  if (!local || state.mode !== 'db') return 0;
  let n = 0;
  for (const k of Object.keys(local.days || {})){
    for (const ev of Object.values(local.days[k].ev || {})){
      if (!ev || ev.del) continue;
      const cur = state.data.days[k] && state.data.days[k].ev && state.data.days[k].ev[ev.id];
      if (cur) continue;
      await putEvent(ev); n++;
    }
  }
  for (const m of Object.values((local.growth && local.growth.m) || {})){ if (m && !m.del && !state.data.growth.m[m.id]) { await putGrowth(m); n++; } }
  return n;
}

/* ---------------- growth math (WHO LMS) ---------------- */
const WHO = window.GD_WHO;
function lmsAt(ind, day){

function fmtPct(p, lang){

  if (p > 99) return lang === 'es' ? '>99.º' : '>99th';
  const n = Math.round(p);
  if (lang === 'es') return n + '.º';

function growthList(){ return Object.values(state.data.growth.m || {}).filter(m => m && !m.del && m.d).sort((a, b) => a.d < b.d ? -1 : 1); }

/* ---------------- day summaries ---------------- */
function summarize(key, nowMs){
  const evs = dayEvents(key);
  const start = dayStartMs(key), end = start + 86400000;
  const now = nowMs || Date.now();
  const s = { feeds: 0, breastMin: 0, L: 0, R: 0, bottleMl: 0, bottles: 0, solids: 0, sleepMin: 0, naps: 0, wet: 0, dirty: 0, diapers: 0, pumpMl: 0, pumps: 0, vitd: false, tummy: 0, temps: [], longestSleep: 0 };

  for (const e of sleeps){
    const a = Math.max(e.s, start), b = Math.min(e.e == null ? now : e.e, end, now);

  }
  for (const e of evs){
    if (e.t === 'feed'){
      s.feeds++;
      if (e.sub === 'L' || e.sub === 'R'){ const mins = ((e.e == null ? now : e.e) - e.s) / 60000; s.breastMin += mins; s[e.sub] += mins; }
      else if (e.sub === 'bottle'){ s.bottles++; s.bottleMl += e.a || 0; }
      else if (e.sub === 'solids') s.solids++;
    } else if (e.t === 'diaper'){
      s.diapers++;
      if (e.sub === 'wet' || e.sub === 'both') s.wet++;
      if (e.sub === 'dirty' || e.sub === 'both') s.dirty++;
    } else if (e.t === 'pump'){ s.pumps++; s.pumpMl += e.a || 0; }
    else if (e.t === 'care'){
      if (e.sub === 'vitd') s.vitd = true;
      if (e.sub === 'tummy') s.tummy += e.a || 0;
      if (e.sub === 'temp' && e.a != null) s.temps.push(e);
    }
  }
  const tot = state.data.days[key] && state.data.days[key].tot;
  if (tot && typeof tot === 'object'){
    s.backfill = true;
    if (tot.feeds != null) s.feeds = Math.max(s.feeds, tot.feeds);
    if (tot.wet != null) s.wet = Math.max(s.wet, tot.wet);
    if (tot.dirty != null) s.dirty = Math.max(s.dirty, tot.dirty);

/* last n day keys ending today, oldest first */
function rangeKeys(n){ const out = []; const t = todayKey(); for (let i = n - 1; i >= 0; i--) out.push(addDays(t, -i)); return out; }
/* longest completed gap between consecutive feed starts whose end falls inside the day, minutes (null if unknown) */
function longestGap(key){
  const start = dayStartMs(key), end = start + 86400000;
  const feeds = eventsBetween(start - 86400000, end).filter(e => e.t === 'feed' && e.s < end);
  let best = null;
  for (let i = 1; i < feeds.length; i++){
    const a = feeds[i - 1], b = feeds[i];
    if (b.s < start) continue;
    const from = a.e != null && a.e > a.s ? a.e : a.s;
    const gap = (b.s - from) / 60000;
    if (best == null || gap > best) best = gap;
  }

function sideBalance(keys){
  let L = 0, R = 0;

/* ---------------- sync text (phone to phone, no server) ---------------- */
const SYNC_HEAD = 'GONZALO-SYNC-1';
function compactEvent(e){ const o = { id: e.id, t: e.t, s: e.s }; for (const k of ['sub', 'e', 'a', 'u', 'n', 'by', 'c', 'del']) if (e[k] != null && e[k] !== '' && e[k] !== false) o[k] = e[k]; return o; }
function exportSync(daysBack){
  const since = daysBack ? addDays(todayKey(), -(daysBack - 1)) : null;
  const out = { v: 1, from: prefs.who || '', at: Date.now(), days: {}, growth: {}, health: {} };
  for (const k of Object.keys(state.data.days).sort()){
    if (since && k < since) continue;
    const d = state.data.days[k]; const ev = {};
    for (const e of Object.values(d.ev || {})) if (e && e.id) ev[e.id] = compactEvent(e);
    if (Object.keys(ev).length || d.tot) out.days[k] = Object.assign({ ev }, d.tot ? { tot: d.tot } : {});
  }
  for (const m of Object.values(state.data.growth.m || {})) if (m && m.id) out.growth[m.id] = m;
  const h = state.data.health || {};

function b64urlEncode(str){

  let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

function b64urlDecode(s){
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s + '==='.slice((s.length + 3) % 4));
  const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
/* pull the sync JSON out of a link, a pasted message, or the raw text */
function extractPayload(text){
  const m = /[#&?]gd=([A-Za-z0-9_-]{16,})/.exec(text);
  if (m){ try { return b64urlDecode(m[1]); } catch (e) { throw new Error('format'); } }
  const i = text.indexOf('{');
  if (i < 0) throw new Error('format');
  return text.slice(i).trim();
}
const SHARE_BASE = 'https://claude.ai/public/artifacts/7bbd10ec-b896-42ee-876d-026bfe69f4a3';
function exportSyncUrl(daysBack){
  const json = exportSync(daysBack).replace(SYNC_HEAD + '\n', '');
  return SHARE_BASE + '#gd=' + b64urlEncode(json);
}
/* a link left in the address bar by the sender, if the frame can see it */
async function consumeLinkPayload(){
  try {
    const h = (location.hash || '') + (location.search || '');
    if (!/[#&?]gd=/.test(h)) return null;
    const res = await importSync(h);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}

  } catch (e) { return null; }
}
async function importSync(text){
  const data = JSON.parse(extractPayload(text));
  if (!data || data.v !== 1) throw new Error('format');

  for (const k of Object.keys(data.days || {})){
    const d = data.days[k];
    for (const e of Object.values(d.ev || {})){
      if (!e || !e.id || typeof e.s !== 'number') continue;
      const cur = state.data.days[k] && state.data.days[k].ev && state.data.days[k].ev[e.id];
      const inc = Object.assign({ e: null, a: null, n: '', by: '' }, e);
      if (!cur){ await putEvent(inc); added++; }
      else if ((inc.c || 0) > (cur.c || 0) || (inc.del && !cur.del) || (cur.e == null && inc.e != null)){ await putEvent(Object.assign({}, cur, inc)); updated++; }
    }

      state.data.days[k].tot = d.tot;
      if (state.mode === 'db' && state.db){ try { await state.db.doc('days/' + k).set(clone(state.data.days[k])); } catch (e) { writeFailed(e); } } else lsSet(LS_DATA, state.data);

  return { added, updated, from: data.from || '', at: data.at || null };
}

/* ---------------- export ---------------- */
function csvExport(){
  const rows = [['date', 'start_local', 'end_local', 'type', 'subtype', 'amount', 'unit', 'minutes', 'note', 'by']];
  for (const e of allEvents()){
    const mins = e.e != null ? Math.round((e.e - e.s) / 60000) : '';
    rows.push([dayKey(e.s), localInputValue(e.s).replace('T', ' '), e.e != null ? localInputValue(e.e).replace('T', ' ') : '', e.t, e.sub || '', e.a != null ? e.a : '', e.u || '', mins, e.n || '', e.by || '']);
  }
  rows.push([]);
  rows.push(['backfill_date', 'feeds', 'wet', 'dirty', 'nursing_min', 'source']);
  for (const k of Object.keys(state.data.days).sort()){ const tt = state.data.days[k].tot; if (tt) rows.push([k, tt.feeds != null ? tt.feeds : '', tt.wet != null ? tt.wet : '', tt.dirty != null ? tt.dirty : '', tt.nurseMin != null ? tt.nurseMin : '', tt.src || '']); }
  rows.push([]);
  rows.push(['growth_date', 'weight_kg', 'length_cm', 'head_cm', 'by']);
  for (const m of growthList()) rows.push([m.d, m.w != null ? m.w : '', m.l != null ? m.l : '', m.h != null ? m.h : '', m.by || '']);

async function saveFile(filename, data){
  if (state.downloads){

    catch (e){ if (e && e.code === 'declined') return 'declined'; console.warn(e); }
  }

return {

})();

function ageString(key, long){
  const days = G.ageDaysAt(key);
  if (days < 91){ const w = Math.floor(days / 7), d = days % 7; return t(long ? 'age_wd_long' : 'age_wd', { w, d }); }
  const a = G.ageMonths(key); return t(long ? 'age_md_long' : 'age_md', { m: a.months, d: a.days });
}
function renderHeader(){
  const key = G.todayKey();
  $('#agebox').innerHTML = `<b>${esc(ageString(key, true))}</b> · ${esc(t('age_days', { n: G.ageDaysAt(key) }))} · ${esc(t('born', { date: G.fmtDateShort(G.PROFILE.dobKey, lang) }))}`;
  const who = G.prefs.who;
  $('#whobtn').innerHTML = `<span class="dot" style="background:var(--sun)"></span>${esc(who || t('who'))}`;
  const m = G.state.mode;
  const cls = m === 'db' ? 'live' : (m === 'local' ? 'local' : '');
  const pub = !!window.GD_PUBLIC;
  const label = pub ? t('public_chip') : (G.state.writeError && m === 'db' ? t('sync_error') : t(m === 'db' ? 'sync_live' : m === 'local' ? 'sync_local' : m === 'readonly' ? 'sync_readonly' : 'sync_connecting'));
  $('#syncbtn').innerHTML = `<span class="dot ${cls}"></span>${esc(label)}`;
  $('#syncbtn').title = pub ? t('public_tip') : (m === 'db' ? t('sync_live_tip') : t('sync_local_tip'));
  $('#robanner').hidden = m !== 'readonly';
}

/* ---------------- helpers ---------------- */
function dueKeyFor(months){ return Number.isInteger(months) ? G.keyAtAgeMonths(months) : G.addDays(G.PROFILE.dobKey, Math.round(months * 30.4375)); }
function visitKeyFor(v){ return v.months < 1 ? G.addDays(G.PROFILE.dobKey, 4) : G.keyAtAgeMonths(v.months); }
const fmtT = ms => G.fmtTime(ms, lang);
const fmtD = mins => G.fmtDur(mins, lang);
function agoStr(ms){ return t('now_ago', { t: fmtD((Date.now() - ms) / 60000) }); }
function evLabel(e){
  if (e.t === 'feed'){
    if (e.sub === 'L' || e.sub === 'R') return t('breast') + ' · ' + t('side_' + e.sub);
    if (e.sub === 'bottle') return t('bottle');
    return t('solids');
  }
  if (e.t === 'sleep') return t('e_sleep');
  if (e.t === 'diaper') return t('e_diaper') + ' · ' + t('d_' + (e.sub || 'wet'));
  if (e.t === 'pump') return t('e_pump') + (e.sub ? ' · ' + t('side_' + e.sub) : '');
  if (e.t === 'care') return t('c_' + (e.sub || 'note'));
  return e.t;
}
function evDetail(e){
  const now = Date.now();
  const parts = [];
  if (e.t === 'feed' && (e.sub === 'L' || e.sub === 'R')) parts.push(e.e == null ? t('running') : fmtD((e.e - e.s) / 60000));
  if (e.t === 'sleep') parts.push(e.e == null ? t('running') : fmtD((e.e - e.s) / 60000) + ' · ' + fmtT(e.s) + '–' + fmtT(e.e));
  if ((e.t === 'feed' && e.sub === 'bottle') || e.t === 'pump') if (e.a != null) parts.push(G.units.vol(e.a, G.prefs.vol));
  if (e.t === 'pump' && e.e == null && e.a == null) parts.push(t('running'));
  if (e.t === 'care' && e.sub === 'tummy' && e.a != null) parts.push(e.a + ' ' + t('min'));
  if (e.t === 'care' && e.sub === 'temp' && e.a != null) parts.push(G.units.temp(G.prefs.temp === 'C' ? (e.u === 'C' ? e.a : (e.a - 32) * 5 / 9) : (e.u === 'C' ? e.a * 9 / 5 + 32 : e.a), G.prefs.temp));
  return parts.join(' · ');
}
function toast(msg, action){
  const el = $('#toast');
  clearTimeout(ui.toastTimer);
  el.className = 'toast'; el.hidden = false;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? action.map((a, i) => `<button data-act="toastact" data-i="${i}">${esc(a.label)}</button>`).join('') : ''}`;
  el._actions = action || [];
  ui.toastTimer = setTimeout(() => { el.hidden = true; }, action ? 7000 : 2500);
}

function fmtHM(mins){ mins = Math.max(0, Math.floor(mins)); return Math.floor(mins / 60) + ':' + G.pad(mins % 60); }
function heroHTML(){
  const now = Date.now();
  const feeds = G.eventsBetween(now - 3 * 86400000, now).filter(e => e.t === 'feed');
  const lastFeed = feeds.length ? feeds[feeds.length - 1] : null;
  const lastBreast = feeds.filter(e => e.sub === 'L' || e.sub === 'R').pop();
  const nextSide = lastBreast ? (lastBreast.sub === 'L' ? 'R' : 'L') : 'L';
  const nextHtml = `${esc(t('hero_next'))} <b class="${nextSide}">${esc(t('side_' + nextSide))}</b>`;
  if (lastFeed && lastFeed.e == null && (lastFeed.sub === 'L' || lastFeed.sub === 'R')){
    $('#hero') && $('#hero').classList.add('nursing');
    return `<div class="num"><span data-elapsed="${lastFeed.s}">${G.fmtClock(now - lastFeed.s)}</span></div>
      <div class="sub">${esc(t('hero_nursing'))} · <b class="${lastFeed.sub}">${esc(t('side_' + lastFeed.sub))}</b></div>
      <div class="detail">${esc(t('now_since', { t: fmtT(lastFeed.s) }))}${lastFeed.by ? ' · ' + esc(lastFeed.by) : ''}</div>`;
  }
  if (!lastFeed) return `<div class="num"><span>—</span><small>${esc(t('hero_hrs'))}</small></div><div class="sub">${esc(t('hero_none'))} · ${nextHtml}</div><div class="detail">${esc(t('typical_feed', { x: L(C.feedIntervalFor(G.ageDays())) }))}</div>`;
  const ref = lastFeed.e != null ? lastFeed.e : lastFeed.s;
  return `<div class="num"><span data-hm="${ref}">${fmtHM((now - ref) / 60000)}</span><small>${esc(t('hero_hrs'))}</small></div>
    <div class="sub">${esc(t('hero_since'))} · ${nextHtml}</div>
    <div class="detail">${esc(t('hero_last'))} ${esc(fmtT(lastFeed.s))} · ${esc(evLabel(lastFeed).replace(t('breast') + ' · ', ''))}${evDetail(lastFeed) ? ' · ' + esc(evDetail(lastFeed)) : ''}${lastFeed.by ? ' · ' + esc(lastFeed.by) : ''} · ${esc(t('typical_feed', { x: L(C.feedIntervalFor(G.ageDays())) }))}</div>`;
}
function nowTilesHTML(){
  const now = Date.now();
  const days = G.ageDays();
  const feeds = G.eventsBetween(now - 3 * 86400000, now).filter(e => e.t === 'feed');
  const lastFeed = feeds.length ? feeds[feeds.length - 1] : null;
  const sleeps = G.eventsBetween(now - 3 * 86400000, now).filter(e => e.t === 'sleep');
  const lastSleep = sleeps.length ? sleeps[sleeps.length - 1] : null;
  const lastDiaper = G.lastOf('diaper');
  const wake = C.wakeFor(days);
  // feed tile
  let feedV = t('now_none'), feedD = '', feedHint = t('typical_feed', { x: L(C.feedIntervalFor(days)) });
  if (lastFeed){
    const ref = lastFeed.e == null && (lastFeed.sub === 'L' || lastFeed.sub === 'R') ? lastFeed.s : (lastFeed.e || lastFeed.s);
    feedV = lastFeed.e == null && (lastFeed.sub === 'L' || lastFeed.sub === 'R') ? `<span data-elapsed="${lastFeed.s}">${G.fmtClock(now - lastFeed.s)}</span>` : `<span data-ago="${ref}">${esc(fmtD((now - ref) / 60000))}</span><small> ${esc(lang === 'es' ? 'hace' : 'ago')}</small>`;
    if (lang === 'es' && !(lastFeed.e == null && (lastFeed.sub === 'L' || lastFeed.sub === 'R'))) feedV = `<small>hace </small><span data-ago="${ref}">${esc(fmtD((now - ref) / 60000))}</span>`;
    feedD = fmtT(lastFeed.s) + ' · ' + evLabel(lastFeed).replace(t('breast') + ' · ', '') + (evDetail(lastFeed) ? ' · ' + evDetail(lastFeed) : '');
  }
  // sleep tile
  let sleepK = t('now_awake'), sleepV = t('now_none'), sleepD = t('now_napHint'), live = '';
  if (lastSleep){
    if (lastSleep.e == null){
      sleepK = t('now_asleep'); live = 'live';
      sleepV = `<span data-elapsed="${lastSleep.s}">${G.fmtClock(now - lastSleep.s)}</span>`;
      sleepD = t('now_since', { t: fmtT(lastSleep.s) });
    } else {
      const awake = (now - lastSleep.e) / 60000;
      sleepV = (lang === 'es' ? '' : '') + `<span data-ago="${lastSleep.e}">${esc(fmtD(awake))}</span>`;
      const a = lastSleep.e + wake.min * 60000, b = lastSleep.e + wake.max * 60000;
      if (now < a) sleepD = t('now_nap', { a: fmtT(a), b: fmtT(b) });
      else if (now <= b) sleepD = t('now_napOpen', { b: fmtT(b) });
      else sleepD = t('now_napPast');
    }
  }
  // diaper tile
  let diaV = t('now_none'), diaD = '';
  if (lastDiaper){
    diaV = lang === 'es' ? `<small>hace </small><span data-ago="${lastDiaper.s}">${esc(fmtD((now - lastDiaper.s) / 60000))}</span>` : `<span data-ago="${lastDiaper.s}">${esc(fmtD((now - lastDiaper.s) / 60000))}</span><small> ago</small>`;
    diaD = fmtT(lastDiaper.s) + ' · ' + t('d_' + (lastDiaper.sub || 'wet'));
  }
  return `
    <div class="tile sleep ${live}"><div class="k">${esc(sleepK)}</div><div class="v">${sleepV}</div><div class="d hint">${esc(sleepD)}</div></div>
    <div class="tile diaper"><div class="k">${esc(t('now_lastDiaper'))}</div><div class="v">${diaV}</div><div class="d">${esc(diaD)}</div></div>`;
}

    b('diaper', 'diaper', 'dirty', I.dirty, esc(t('act_dirty')), t('e_diaper')) +
    b('feed', 'pump', '', I.pump, rp ? `<span data-elapsed="${rp.s}">${G.fmtClock(now - rp.s)}</span>` : esc(t('act_pump')), rp ? t('act_stop') : '', !!rp) +
    b('', 'more', '', I.more, esc(t('act_more')), t('c_vitd') + ', ' + t('c_tummy') + '…');
}
function totalsHTML(key){
  const s = G.summarize(key);
  const days = G.ageDaysAt(key);
  const feedBits = [];
  if (s.breastMin) feedBits.push(t('tot_breast') + ' ' + fmtD(s.breastMin) + (s.L || s.R ? ' (' + t('side_L')[0] + ' ' + Math.round(s.L) + ' · ' + t('side_R')[0] + ' ' + Math.round(s.R) + ')' : ''));
  if (s.bottleMl) feedBits.push(t('bottle').toLowerCase() + ' ' + G.units.vol(s.bottleMl, G.prefs.vol));
  if (s.solids) feedBits.push(t('solids').toLowerCase() + ' ×' + s.solids);
  if (s.pumpMl) feedBits.push(t('e_pump').toLowerCase() + ' ' + G.units.vol(s.pumpMl, G.prefs.vol));
  return `
    <div class="stat feed"><div class="k"><i></i>${esc(t('tot_feeds'))}</div><div class="v">${s.feeds}</div><div class="d">${esc(feedBits.join(' · ') || '—')}</div><div class="d hint">${esc(t('tot_typical', { x: C.feedsPerDayFor(days) }))}</div></div>
    <div class="stat sleep"><div class="k"><i></i>${esc(t('tot_sleep'))}</div><div class="v">${esc(fmtD(s.sleepMin))}</div><div class="d">${s.naps} ${esc(t('tot_naps'))}${s.longestSleep ? ' · max ' + esc(fmtD(s.longestSleep)) : ''}</div><div class="d hint">${esc(t('tot_typical', { x: C.sleepHoursFor(days) + ' h' }))}</div></div>
    <div class="stat diaper"><div class="k"><i></i>${esc(t('tot_diapers'))}</div><div class="v">${s.diapers}</div><div class="d">${s.wet} ${esc(t('tot_wet'))} · ${s.dirty} ${esc(t('tot_dirty'))}</div><div class="d hint">${esc(days >= 5 ? t('tot_wetTarget') : '')}</div></div>`;
}

/* ---------------- ribbon ---------------- */
function renderRibbon(container, key){
  if (!container) return;
  const W = Math.max(280, container.clientWidth || 600), H = 74, top = 8, trackH = 34, axisY = top + trackH + 16;
  const start = G.dayStartMs(key), end = start + 86400000, now = Date.now();
  const x = ms => G.clamp((ms - start) / 86400000, 0, 1) * W;
  const evs = G.eventsBetween(start, end);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t('ribbon_title'))}">`;
  g += `<rect class="track" x="0" y="${top}" width="${W}" height="${trackH}" rx="6"/>`;
  const hits = [];
  for (const e of evs){
    if (e.t === 'sleep'){
      const a = Math.max(e.s, start), b = Math.min(e.e == null ? now : e.e, end);
      if (b <= a) continue;
      const x1 = x(a), x2 = Math.max(x(b), x1 + 2);
      g += `<rect class="sl ${e.e == null ? 'run' : ''}" x="${x1.toFixed(1)}" y="${top + 2}" width="${(x2 - x1).toFixed(1)}" height="${trackH - 4}" rx="4"/>`;
      hits.push({ x1, x2, y1: top, y2: top + trackH, e });
    }
  }
  for (const e of evs){
    if (e.s < start || e.s >= end) continue;
    const cx = x(e.s);
    if (e.t === 'feed'){
      const dur = e.e != null && (e.sub === 'L' || e.sub === 'R') ? (e.e - e.s) : 0;
      const w = Math.max(3, x(e.s + dur) - cx);
      g += `<rect class="fd" x="${(cx - 1.5).toFixed(1)}" y="${top + trackH / 2 + 2}" width="${w.toFixed(1)}" height="${trackH / 2 - 5}" rx="2"/>`;
      hits.push({ x1: cx - 6, x2: cx + Math.max(6, w), y1: top, y2: top + trackH, e });
    } else if (e.t === 'diaper'){
      g += `<circle class="dp" cx="${cx.toFixed(1)}" cy="${top + 9}" r="4"/>`;
      hits.push({ x1: cx - 7, x2: cx + 7, y1: top, y2: top + 18, e });
    } else if (e.t === 'pump' || e.t === 'care'){
      g += `<rect class="cr" x="${(cx - 1.5).toFixed(1)}" y="${top + 4}" width="3" height="10" rx="1.5"/>`;
      hits.push({ x1: cx - 6, x2: cx + 6, y1: top, y2: top + 18, e });
    }
  }
  if (now >= start && now <= end) g += `<line class="now" x1="${x(now).toFixed(1)}" x2="${x(now).toFixed(1)}" y1="${top - 4}" y2="${top + trackH + 4}"/>`;
  g += '<g class="axis">';
  for (let h = 0; h <= 24; h += 6){
    const xx = h / 24 * W;
    const lab = lang === 'es' ? (h === 24 ? '24' : G.pad(h) + ':00') : (h === 0 || h === 24 ? '12am' : h === 12 ? '12pm' : h < 12 ? h + 'am' : (h - 12) + 'pm');
    g += `<line x1="${xx}" x2="${xx}" y1="${top + trackH + 2}" y2="${top + trackH + 6}"/><text x="${xx}" y="${axisY + 6}" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${lab}</text>`;
  }
  g += '</g>';
  hits.forEach((h, i) => { g += `<rect class="hit" data-hit="${i}" x="${h.x1.toFixed(1)}" y="${h.y1}" width="${(h.x2 - h.x1).toFixed(1)}" height="${h.y2 - h.y1}"/>`; });
  g += '</svg>';
  container.innerHTML = g;
  container._hits = hits;
  const svg = container.querySelector('svg');
  const show = (h, clientX) => {
    let tip = container.querySelector('.tip');
    if (!tip){ tip = document.createElement('div'); tip.className = 'tip'; container.appendChild(tip); }
    const e = h.e;
    tip.innerHTML = `<b>${esc(evLabel(e))}</b> ${esc(fmtT(e.s))}${e.e != null ? '–' + esc(fmtT(e.e)) : ''}${evDetail(e) ? '<br>' + esc(evDetail(e)) : ''}${e.by ? '<br><span style="opacity:.7">' + esc(e.by) + '</span>' : ''}`;
    const r = container.getBoundingClientRect();
    tip.style.left = G.clamp(clientX - r.left, 60, r.width - 60) + 'px';
    tip.style.top = (h.y1) + 'px';
  };
  svg.addEventListener('pointermove', ev => {
    const el = ev.target.closest('[data-hit]');
    if (el) show(hits[+el.dataset.hit], ev.clientX); else { const tp = container.querySelector('.tip'); if (tp) tp.remove(); }
  });
  svg.addEventListener('pointerleave', () => { const tp = container.querySelector('.tip'); if (tp) tp.remove(); });
  svg.addEventListener('click', ev => { const el = ev.target.closest('[data-hit]'); if (el) openEdit(hits[+el.dataset.hit].e); });
}

const MEAS = { w: { ind: 'wfa', key: 'w', label: 'g_weight', fmt: v => G.units.wt(v, G.prefs.wt), unit: () => G.prefs.wt }, l: { ind: 'lfa', key: 'l', label: 'g_length', fmt: v => G.units.len(v, G.prefs.len), unit: () => G.prefs.len }, h: { ind: 'hcfa', key: 'h', label: 'g_head', fmt: v => G.units.len(v, G.prefs.len), unit: () => G.prefs.len } };
function renderGrowth(){
  const p = $('#p-growth');
  const list = G.growthList();
  const latest = {};
  for (const m of list) for (const k of ['w', 'l', 'h']) if (m[k] != null) latest[k] = m;
  const tiles = ['w', 'l', 'h'].map(k => {
    const m = latest[k];
    if (!m) return `<div class="stat"><div class="k">${esc(t(MEAS[k].label))}</div><div class="v muted">—</div><div class="d hint">${esc(t('g_add'))}</div></div>`;

      </div>
      <div id="gchart" class="chart" ${ui.gTable ? 'hidden' : ''}></div>
      <div id="gtable" class="tblwrap" ${ui.gTable ? '' : 'hidden'}></div>
      ${gain}
      ${list.length ? `<p class="small muted" style="margin-top:6px">${esc(t('g_hover'))}</p>` : `<div class="empty" style="margin-top:8px">${esc(t('g_empty'))}</div>`}
    </section>
    <section class="card">
      <div class="cardhead"><h2>${esc(t('g_add'))}</h2><span class="sub">${esc(t('g_hint'))}</span></div>
      <form id="gform" class="gform">
        <div class="field"><label>${esc(t('g_date'))}</label><input type="date" name="d" value="${G.todayKey()}" min="${G.PROFILE.dobKey}" max="${G.todayKey()}" required></div>
        <div class="field"><label>${esc(t('g_weight'))} (${G.prefs.wt})</label><input type="number" step="any" inputmode="decimal" name="w" placeholder="${G.prefs.wt === 'lb' ? '8.9' : '4.05'}"></div>
        <div class="field"><label>${esc(t('g_length'))} (${G.prefs.len})</label><input type="number" step="any" inputmode="decimal" name="l" placeholder="${G.prefs.len === 'in' ? '21' : '53.5'}"></div>
        <div class="field"><label>${esc(t('g_head'))} (${G.prefs.len})</label><input type="number" step="any" inputmode="decimal" name="h" placeholder="${G.prefs.len === 'in' ? '14.4' : '36.5'}"></div>
        <button class="btn primary" type="submit" style="grid-column:1/-1">${esc(t('add'))}</button>

  renderGrowthChart($('#gchart'), ui.gMeasure, ui.gRange);

function renderGrowthTable(container){

function renderGrowthChart(container, mk, rangeMonths){
  const meas = MEAS[mk];
  const W = Math.max(300, container.clientWidth || 640), H = 300;
  const padL = 44, padR = 44, padT = 14, padB = 34;
  const maxDay = Math.round(rangeMonths * 30.4375);
  const list = G.growthList().filter(m => m[mk] != null);
  const pts = list.map(m => ({ day: G.ageDaysAt(m.d), v: m[mk], m }));
  const conv = v => mk === 'w' ? (G.prefs.wt === 'lb' ? v / 0.45359237 : v) : (G.prefs.len === 'in' ? v / 2.54 : v);
  const unit = mk === 'w' ? G.prefs.wt : G.prefs.len;
  const curves = {};
  const stepD = maxDay <= 92 ? 1 : maxDay <= 183 ? 2 : 4;
  let yMin = Infinity, yMax = -Infinity;
  for (const pkey of Object.keys(G.zOfP)){
    const z = G.zOfP[pkey]; const arr = [];
    for (let d = 0; d <= maxDay; d += stepD){ const v = conv(G.xOfZ(z, G.lmsAt(meas.ind, d))); arr.push([d, v]); }
    curves[pkey] = arr; yMin = Math.min(yMin, arr[0][1]); yMax = Math.max(yMax, arr[arr.length - 1][1]);
  }
  for (const p of pts) if (p.day <= maxDay){ yMin = Math.min(yMin, conv(p.v)); yMax = Math.max(yMax, conv(p.v)); }
  const span = yMax - yMin; yMin -= span * 0.08; yMax += span * 0.08;
  const X = d => padL + d / maxDay * (W - padL - padR);
  const Y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t(meas.label))}">`;
  // y grid
  const niceStep = (() => { const raw = (yMax - yMin) / 5; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; })();
  s += '<g class="grid">';
  for (let v = Math.ceil(yMin / niceStep) * niceStep; v <= yMax; v += niceStep) s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;
  s += '</g><g class="axis">';
  for (let v = Math.ceil(yMin / niceStep) * niceStep; v <= yMax; v += niceStep) s += `<text x="${padL - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${+v.toFixed(2)}</text>`;
  // x axis
  const xt = [];
  if (maxDay <= 92) for (let w = 0; w <= 13; w += (maxDay <= 92 ? 1 : 2)) xt.push([w * 7, w + (lang === 'es' ? ' s' : 'w')]);
  else { const step = maxDay <= 183 ? 1 : maxDay <= 366 ? 2 : 3; for (let m = 0; m <= rangeMonths; m += step) xt.push([Math.round(m * 30.4375), m + (lang === 'es' ? ' m' : 'm')]); }
  for (const [d, lab] of xt){ if (d > maxDay) continue; s += `<line x1="${X(d).toFixed(1)}" x2="${X(d).toFixed(1)}" y1="${H - padB}" y2="${H - padB + 4}"/><text x="${X(d).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle">${lab}</text>`; }
  s += `<line x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}"/>`;
  s += `<text x="${padL - 6}" y="${padT - 3}" text-anchor="end">${unit}</text>`;
  s += '</g>';
  // bands 3–97 and 15–85
  const path = arr => arr.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const band = (a, b) => path(curves[a]) + ' ' + curves[b].slice().reverse().map(p => 'L' + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ') + ' Z';
  s += `<path class="band" d="${band(3, 97)}"/><path class="band" d="${band(15, 85)}"/>`;
  for (const pkey of ['3', '15', '50', '85', '97']){
    s += `<path class="pct ${pkey === '50' ? 'p50' : ''}" d="${path(curves[pkey])}"/>`;
    const last = curves[pkey][curves[pkey].length - 1];
    s += `<text class="plab" x="${(W - padR + 5)}" y="${(Y(last[1]) + 3.5).toFixed(1)}">${pkey}${lang === 'es' ? '' : (pkey === '3' ? 'rd' : 'th')}</text>`;
  }
  // his line + points
  const vis = pts.filter(p => p.day <= maxDay);
  if (vis.length > 1) s += `<path class="me" d="${vis.map((p, i) => (i ? 'L' : 'M') + X(p.day).toFixed(1) + ' ' + Y(conv(p.v)).toFixed(1)).join(' ')}"/>`;
  vis.forEach((p, i) => { s += `<circle class="pt" data-pt="${i}" cx="${X(p.day).toFixed(1)}" cy="${Y(conv(p.v)).toFixed(1)}" r="5"/>`; });
  vis.forEach((p, i) => { s += `<circle class="hit" data-pt="${i}" cx="${X(p.day).toFixed(1)}" cy="${Y(conv(p.v)).toFixed(1)}" r="14" fill="transparent" style="cursor:pointer"/>`; });
  // today marker
  const td = G.ageDays(); if (td <= maxDay) s += `<line class="xh" x1="${X(td).toFixed(1)}" x2="${X(td).toFixed(1)}" y1="${padT}" y2="${H - padB}" stroke-dasharray="0" opacity=".5"/>`;
  s += '</svg>';
  container.innerHTML = s;
  const svg = container.querySelector('svg');
  const show = (p, cx, cy) => {
    let tip = container.querySelector('.tip'); if (!tip){ tip = document.createElement('div'); tip.className = 'tip'; container.appendChild(tip); }
    const pc = G.percentile(meas.ind, p.v, p.day);
    tip.innerHTML = `<b>${esc(meas.fmt(p.v))}</b> · ${esc(t('g_pct', { p: G.fmtPct(pc.p, lang) }))}<br>${esc(G.fmtDateShort(p.m.d, lang))} · ${esc(ageString(p.m.d))} · z ${pc.z.toFixed(2)}`;
    tip.style.left = cx + 'px'; tip.style.top = cy + 'px';
  };
  svg.addEventListener('pointermove', ev => {
    const el = ev.target.closest('[data-pt]');
    if (el){ const r = container.getBoundingClientRect(); const p = vis[+el.dataset.pt]; show(p, X(p.day) / W * r.width, Y(conv(p.v)) / H * r.height); }
    else { const tp = container.querySelector('.tip'); if (tp) tp.remove(); }
  });
  svg.addEventListener('pointerleave', () => { const tp = container.querySelector('.tip'); if (tp) tp.remove(); });
  svg.addEventListener('click', ev => { const el = ev.target.closest('[data-pt]'); if (el) openGrowthEdit(vis[+el.dataset.pt].m); });
}

async function ask(q){
  if (!G.state.sample || ui.askBusy || !q) return;
  const out = $('#askout'); if (!out) return;
  ui.askBusy = true; out.textContent = t('ask_thinking');
  const now = Date.now();
  const evs = G.eventsBetween(now - 24 * 3600000, now).filter(e => e.s >= now - 24 * 3600000).slice(-60);
  const log = evs.map(e => `${G.localInputValue(e.s).replace('T', ' ')}${e.e != null ? '–' + G.localInputValue(e.e).slice(11) : ''} ${evLabel(e)}${evDetail(e) ? ' ' + evDetail(e) : ''}${e.n ? ' note: ' + e.n : ''}`).join('\n');
  const days = G.ageDays(); const band = C.bandFor(days); const wake = C.wakeFor(days);
  const s1 = G.summarize(G.todayKey()), s2 = G.summarize(G.addDays(G.todayKey(), -1));
  const gl = G.growthList(); const gtxt = gl.length ? gl.slice(-3).map(m => `${m.d}: ${m.w != null ? m.w + ' kg' : ''} ${m.l != null ? m.l + ' cm' : ''} ${m.h != null ? 'head ' + m.h + ' cm' : ''}`).join('; ') : 'none logged';
  const prompt = `You are a warm, concise assistant helping the parents of a baby boy. Answer in ${lang === 'es' ? 'Spanish' : 'English'}, in under 150 words, plain text, no markdown headers. You are not a doctor: give general, evidence-based context (AAP, CDC, WHO) and say clearly when something should go to the pediatrician. Never diagnose.
Baby: Gonzalo, born 2026-08-17 in Miami. Age now: ${days} days (${ageString(G.todayKey(), true)}). Current local time (Miami): ${G.localInputValue(Math.floor(now / 3600000) * 3600000).replace('T', ' ')} (rounded to the hour).
Typical ranges for his age (context, not targets): sleep ${C.sleepHoursFor(days)} h/day, wake windows ${wake.min}-${wake.max} min, feeds ${C.feedsPerDayFor(days)} per day, feed interval ${C.feedIntervalFor(days).en}. Stage note: ${band.sleep.en} ${band.feed.en}
Today so far: ${s1.feeds} feeds (breast ${Math.round(s1.breastMin)} min, bottle ${Math.round(s1.bottleMl)} ml), sleep ${Math.round(s1.sleepMin)} min in ${s1.naps} sleeps, diapers ${s1.wet} wet / ${s1.dirty} dirty. Yesterday: ${s2.feeds} feeds, sleep ${Math.round(s2.sleepMin)} min, diapers ${s2.wet} wet / ${s2.dirty} dirty.
Growth log: ${gtxt}.
Log of the last 24 hours (Miami time):
${log || '(no entries yet)'}

Question: ${q}`;
  try {
    const res = await G.state.sample(prompt, { onText: u => { out.textContent = u.text; }, modelTier: 'quick' });
    out.textContent = res.text;
  } catch (e) {
    out.textContent = (e && e.text) ? e.text : t('ask_err');
    console.warn(e);
  }
  ui.askBusy = false;
}
