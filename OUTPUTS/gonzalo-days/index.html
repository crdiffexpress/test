function dayLabel(key){ const k = G.keyParts(key); const wd = G.fmtDate(key, lang, { weekday: 'short', day: undefined, month: undefined }); return wd.replace('.', '') + ' ' + k.d; }
function patternsHTML(n, W){
  const keys = G.rangeKeys(n);
  const today = G.todayKey();
  W = Math.max(300, Math.round(W || 640));
  const _W = W, rowH = n <= 7 ? 26 : n <= 14 ? 18 : 12, padL = 52, padR = 10, padT = 8, padB = 22;
  const H = padT + rowH * keys.length + padB;
  const x = h => padL + h / 24 * (W - padL - padR);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('pat_rhythm'))}">`;
  keys.forEach((k, i) => {
    const y = padT + i * rowH;
    svg += `<rect class="night" x="${x(0)}" y="${y + 1}" width="${x(7) - x(0)}" height="${rowH - 2}"/><rect class="night" x="${x(19)}" y="${y + 1}" width="${x(24) - x(19)}" height="${rowH - 2}"/>`;
    svg += `<line class="rowline" x1="${padL}" x2="${W - padR}" y1="${y + rowH}" y2="${y + rowH}"/>`;
    svg += `<text class="rowlab" x="${padL - 8}" y="${y + rowH / 2 + 3.5}" text-anchor="end">${esc(dayLabel(k))}</text>`;
    const start = G.dayStartMs(k), end = start + 86400000;
    const evs = G.eventsBetween(start, end);
    const hx = ms => x(G.clamp((ms - start) / 3600000, 0, 24));
    for (const e of evs) if (e.t === 'sleep'){ const a = Math.max(e.s, start), b = Math.min(e.e == null ? Date.now() : e.e, end); if (b > a) svg += `<rect class="sl" x="${hx(a).toFixed(1)}" y="${y + 3}" width="${Math.max(2, hx(b) - hx(a)).toFixed(1)}" height="${rowH - 6}" rx="2"/>`; }
    const r = rowH >= 18 ? 3.5 : 2.5;
    for (const e of evs){
      if (e.s < start || e.s >= end) continue;
      const cx = hx(e.s), cy = y + rowH / 2;
      const tip = `${fmtT(e.s)} · ${evLabel(e)}${evDetail(e) ? ' · ' + evDetail(e) : ''}`;
      if (e.t === 'feed') svg += `<circle class="fd" cx="${cx.toFixed(1)}" cy="${cy}" r="${r}" data-tip="${esc(tip)}"/>`;
      else if (e.t === 'diaper'){
        if (e.sub === 'wet' || e.sub === 'both') svg += `<circle class="wt" cx="${cx.toFixed(1)}" cy="${cy - (e.sub === 'both' ? r : 0)}" r="${r}" data-tip="${esc(tip)}"/>`;
        if (e.sub === 'dirty' || e.sub === 'both') svg += `<rect class="dt" x="${(cx - r).toFixed(1)}" y="${cy - r + (e.sub === 'both' ? r : 0)}" width="${r * 2}" height="${r * 2}" rx="1" data-tip="${esc(tip)}"/>`;
      } else if (e.t === 'pump' || e.t === 'care') svg += `<rect class="cr" x="${(cx - 1).toFixed(1)}" y="${cy - r}" width="2" height="${r * 2}" data-tip="${esc(tip)}"/>`;
    }
    const s = G.summarize(k);
    if (s.backfill && !evs.some(e => e.t === 'feed' || e.t === 'diaper')) svg += `<text x="${x(12)}" y="${y + rowH / 2 + 3.5}" text-anchor="middle" style="opacity:.8">${esc(t('pat_totalsOnly'))} · ${s.feeds} ${esc(t('pat_feeds'))} · ${s.wet} ${esc(t('pat_wet'))} · ${s.dirty} ${esc(t('pat_dirty'))}</text>`;
  });
  svg += '<g class="axis">';
  for (let h = 0; h <= 24; h += 6){ const lab = lang === 'es' ? G.pad(h % 24) + ':00' : (h % 24 === 0 ? '12a' : h === 12 ? '12p' : h < 12 ? h + 'a' : (h - 12) + 'p'); svg += `<line x1="${x(h)}" x2="${x(h)}" y1="${H - padB + 2}" y2="${H - padB + 6}"/><text x="${x(h)}" y="${H - padB + 17}" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${lab}</text>`; }
  svg += '</g></svg>';
  const rhythm = `<section class="card pat"><div class="cardhead"><h2>${esc(t('pat_rhythm'))}</h2><span class="sub">${esc(t('pat_rhythmSub'))}</span></div><div class="chart" id="pat-rhythm">${svg}</div>
    <div class="legend"><span class="feed"><i></i>${esc(t('pat_feeds'))}</span><span class="wet"><i></i>${esc(t('pat_wet'))}</span><span class="dirty"><i style="border-radius:1px"></i>${esc(t('pat_dirty'))}</span><span class="sleep"><i style="opacity:.4"></i>${esc(t('pat_sleep'))}</span><span class="night"><i></i>${esc(t('pat_night'))}</span></div></section>`;

  // daily totals (grouped bars)
  const sums = keys.map(k => Object.assign({ k }, G.summarize(k)));
  const hasData = sums.some(s => s.feeds || s.diapers || s.sleepMin);
  const BW = W, BH = 190, bPadL = 30, bPadR = 10, bPadT = 18, bPadB = 24;
  const maxV = Math.max(4, ...sums.map(s => Math.max(s.feeds, s.wet, s.dirty)));
  const slot = (BW - bPadL - bPadR) / keys.length;
  const bw = Math.min(24, Math.max(4, (slot - 6) / 3 - 2));
  const by = v => bPadT + (1 - v / maxV) * (BH - bPadT - bPadB);
  let bars = `<svg viewBox="0 0 ${BW} ${BH}" role="img" aria-label="${esc(t('pat_totals'))}"><g class="grid">`;
  const step = maxV <= 8 ? 2 : maxV <= 20 ? 5 : 10;
  for (let v = 0; v <= maxV; v += step) bars += `<line x1="${bPadL}" x2="${BW - bPadR}" y1="${by(v).toFixed(1)}" y2="${by(v).toFixed(1)}"/><text x="${bPadL - 6}" y="${(by(v) + 3.5).toFixed(1)}" text-anchor="end">${v}</text>`;
  bars += '</g>';
  const maxFeeds = Math.max(...sums.map(s => s.feeds));
  sums.forEach((s, i) => {
    const x0 = bPadL + i * slot + (slot - (bw * 3 + 4)) / 2;
    const bar = (cls, v, j, label) => { if (!v) return ''; const yy = by(v); return `<rect class="${cls}" x="${(x0 + j * (bw + 2)).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(by(0) - yy).toFixed(1)}" rx="3" data-tip="${esc(dayLabel(s.k) + ' · ' + label + ' ' + v)}"/>`; };
    bars += bar('bar-f', s.feeds, 0, t('pat_feeds')) + bar('bar-w', s.wet, 1, t('pat_wet')) + bar('bar-d', s.dirty, 2, t('pat_dirty'));
    if (s.feeds && s.feeds === maxFeeds) bars += `<text class="vlab" x="${(x0 + bw / 2).toFixed(1)}" y="${(by(s.feeds) - 4).toFixed(1)}" text-anchor="middle">${s.feeds}</text>`;
    if (n <= 14 || i % 5 === 0 || i === keys.length - 1) bars += `<text x="${(x0 + (bw * 3 + 4) / 2).toFixed(1)}" y="${BH - bPadB + 15}" text-anchor="middle">${n <= 7 ? esc(dayLabel(s.k)) : G.keyParts(s.k).d}</text>`;
  });
  bars += `<line class="axis" x1="${bPadL}" x2="${BW - bPadR}" y1="${by(0)}" y2="${by(0)}" stroke="var(--rule)"/></svg>`;
  const avgOf = f => { const arr = sums.filter(s => s.k !== today && (s.feeds || s.diapers || s.backfill)); return arr.length ? (arr.reduce((a, s) => a + f(s), 0) / arr.length).toFixed(1) : '—'; };
  const totals = `<section class="card pat"><div class="cardhead"><h2>${esc(t('pat_totals'))}</h2><span class="sub">${esc(t('pat_avg'))}: ${avgOf(s => s.feeds)} ${esc(t('pat_feeds'))} · ${avgOf(s => s.wet)} ${esc(t('pat_wet'))} · ${avgOf(s => s.dirty)} ${esc(t('pat_dirty'))}</span></div><div class="chart" id="pat-bars">${bars}</div>
    <div class="legend"><span class="feed"><i></i>${esc(t('pat_feeds'))}</span><span class="wet"><i></i>${esc(t('pat_wet'))}</span><span class="dirty"><i></i>${esc(t('pat_dirty'))}</span></div></section>`;

  // sleep hours (single series) when any sleep logged
  let sleepCard = '';
  if (sums.some(s => s.sleepMin > 0)){
    const maxS = Math.max(8, ...sums.map(s => s.sleepMin / 60));
    const sy = v => bPadT + (1 - v / maxS) * (BH - bPadT - bPadB);
    let sv = `<svg viewBox="0 0 ${BW} ${BH}" role="img" aria-label="${esc(t('pat_sleepHours'))}"><g class="grid">`;
    for (let v = 0; v <= maxS; v += 4) sv += `<line x1="${bPadL}" x2="${BW - bPadR}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"/><text x="${bPadL - 6}" y="${(sy(v) + 3.5).toFixed(1)}" text-anchor="end">${v}h</text>`;
    sv += '</g>';
    const sbw = Math.min(24, slot - 8);
    sums.forEach((s, i) => { const v = s.sleepMin / 60; if (!v) return; const x0 = bPadL + i * slot + (slot - sbw) / 2; sv += `<rect class="bar-s" x="${x0.toFixed(1)}" y="${sy(v).toFixed(1)}" width="${sbw.toFixed(1)}" height="${(sy(0) - sy(v)).toFixed(1)}" rx="3" data-tip="${esc(dayLabel(s.k) + ' · ' + fmtD(s.sleepMin))}"/>`; if (n <= 14 || i % 5 === 0) sv += `<text x="${(x0 + sbw / 2).toFixed(1)}" y="${BH - bPadB + 15}" text-anchor="middle">${n <= 7 ? esc(dayLabel(s.k)) : G.keyParts(s.k).d}</text>`; });
    sv += '</svg>';
    sleepCard = `<section class="card pat"><div class="cardhead"><h2>${esc(t('pat_sleepHours'))}</h2><span class="sub">${esc(t('tot_typical', { x: C.sleepHoursFor(G.ageDays()) + ' h' }))}</span></div><div class="chart">${sv}</div></section>`;
  }

  // longest stretch line
  const gaps = keys.map(k => { const g = G.longestGap(k); return g != null ? g / 60 : null; });
  const known = gaps.filter(v => v != null);
  let stretch = '';
  if (known.length){
    const LH = 170, lPadL = 34, lPadR = 40, lPadT = 14, lPadB = 24;
    const maxG = Math.max(4, Math.ceil(Math.max(...known)));
    const lx = i => lPadL + (keys.length === 1 ? 0 : i / (keys.length - 1)) * (BW - lPadL - lPadR);
    const ly = v => lPadT + (1 - v / maxG) * (LH - lPadT - lPadB);
    let ls = `<svg viewBox="0 0 ${BW} ${LH}" role="img" aria-label="${esc(t('pat_stretch'))}"><g class="grid">`;
    for (let v = 0; v <= maxG; v += 2) ls += `<line x1="${lPadL}" x2="${BW - lPadR}" y1="${ly(v).toFixed(1)}" y2="${ly(v).toFixed(1)}"/><text x="${lPadL - 6}" y="${(ly(v) + 3.5).toFixed(1)}" text-anchor="end">${v}h</text>`;
    ls += '</g>';
    let d = '', pen = false;
    gaps.forEach((v, i) => { if (v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + lx(i).toFixed(1) + ' ' + ly(v).toFixed(1) + ' '; pen = true; });
    ls += `<path class="line" d="${d.trim()}"/>`;
    gaps.forEach((v, i) => { if (v == null) return; ls += `<circle class="pt" cx="${lx(i).toFixed(1)}" cy="${ly(v).toFixed(1)}" r="4.5" data-tip="${esc(dayLabel(keys[i]) + ' · ' + fmtD(v * 60))}"/>`; });
    let lastI = -1; gaps.forEach((v, i) => { if (v != null) lastI = i; });
    if (lastI >= 0) ls += `<text class="vlab" x="${(lx(lastI) + 8).toFixed(1)}" y="${(ly(gaps[lastI]) + 3.5).toFixed(1)}">${fmtD(gaps[lastI] * 60)}</text>`;
    ls += `<text x="${lPadL}" y="${LH - 6}">${esc(G.fmtDateShort(keys[0], lang))}</text><text x="${BW - lPadR}" y="${LH - 6}" text-anchor="end">${esc(t('today').toLowerCase())}</text></svg>`;
    stretch = `<section class="card pat"><div class="cardhead"><h2>${esc(t('pat_stretch'))}</h2><span class="sub">${esc(t('pat_longest'))}: <b class="mono">${esc(fmtD(Math.max(...known) * 60))}</b></span></div><div class="chart">${ls}</div></section>`;
  }

  // side balance
  const sb = G.sideBalance(keys); const tot = sb.L + sb.R;
  const side = tot ? `<section class="card"><div class="cardhead"><h2>${esc(t('pat_side'))}</h2><span class="sub">${esc(fmtD(tot))}</span></div>
    <div class="sidebar" role="img" aria-label="${esc(t('pat_side'))}"><div class="L" style="width:${(sb.L / tot * 100).toFixed(1)}%"></div><div class="R" style="flex:1"></div></div>
    <div class="sidelab"><span><b>${esc(t('pat_left'))}</b> ${Math.round(sb.L)} ${esc(t('min'))} · ${Math.round(sb.L / tot * 100)}%</span><span><b>${esc(t('pat_right'))}</b> ${Math.round(sb.R)} ${esc(t('min'))} · ${Math.round(sb.R / tot * 100)}%</span></div></section>`
    : `<section class="card"><div class="cardhead"><h2>${esc(t('pat_side'))}</h2></div><p class="small muted">${esc(t('pat_noSides'))}</p></section>`;
  if (!hasData) return `<div class="empty">${esc(t('pat_empty'))}</div>`;
  return rhythm + totals + sleepCard + stretch + side;
}
function wirePatterns(root){
  root.querySelectorAll('.pat .chart').forEach(container => {
    const svg = container.querySelector('svg'); if (!svg) return;
    svg.addEventListener('pointermove', ev => {
      const el = ev.target.closest('[data-tip]');
      let tip = container.querySelector('.tip');
      if (!el){ if (tip) tip.remove(); return; }
      if (!tip){ tip = document.createElement('div'); tip.className = 'tip'; container.appendChild(tip); }
      tip.textContent = el.dataset.tip;
      const r = container.getBoundingClientRect();
      tip.style.left = G.clamp(ev.clientX - r.left, 50, r.width - 50) + 'px'; tip.style.top = (ev.clientY - r.top - 6) + 'px';
    });
    svg.addEventListener('pointerleave', () => { const tip = container.querySelector('.tip'); if (tip) tip.remove(); });
  });
}

/* ---------------- DOCTOR SUMMARY ---------------- */
function doctorData(){
  const now = Date.now();
  const evs = G.eventsBetween(now - 86400000, now).filter(e => e.s >= now - 86400000);
  const feeds = evs.filter(e => e.t === 'feed');
  const nursing = feeds.filter(e => e.sub === 'L' || e.sub === 'R');
  const bottles = feeds.filter(e => e.sub === 'bottle');
  const nurseMin = nursing.reduce((a, e) => a + ((e.e == null ? now : e.e) - e.s) / 60000, 0);
  const bottleMl = bottles.reduce((a, e) => a + (e.a || 0), 0);
  const wet = evs.filter(e => e.t === 'diaper' && (e.sub === 'wet' || e.sub === 'both')).length;
  const dirty = evs.filter(e => e.t === 'diaper' && (e.sub === 'dirty' || e.sub === 'both')).length;
  let gap = null; for (let i = 1; i < feeds.length; i++){ const a = feeds[i - 1], b = feeds[i]; const g = (b.s - (a.e != null && a.e > a.s ? a.e : a.s)) / 60000; if (gap == null || g > gap) gap = g; }
  const L = nursing.filter(e => e.sub === 'L'), R = nursing.filter(e => e.sub === 'R');
  const mins = arr => arr.reduce((a, e) => a + ((e.e == null ? now : e.e) - e.s) / 60000, 0);
  const sleepMin = G.eventsBetween(now - 86400000, now).filter(e => e.t === 'sleep').reduce((a, e) => a + Math.max(0, Math.min(e.e == null ? now : e.e, now) - Math.max(e.s, now - 86400000)) / 60000, 0);
  const all = G.eventsBetween(now - 7 * 86400000, now);
  const lastFeed = all.filter(e => e.t === 'feed').pop();
  const lastWet = all.filter(e => e.t === 'diaper' && (e.sub === 'wet' || e.sub === 'both')).pop();
  const lastDirty = all.filter(e => e.t === 'diaper' && (e.sub === 'dirty' || e.sub === 'both')).pop();
  const days = G.rangeKeys(7).map(k => Object.assign({ k }, G.summarize(k), { gap: G.longestGap(k) }));
  return { now, feeds: feeds.length, nursing: nursing.length, nurseMin, bottles: bottles.length, bottleMl, wet, dirty, gap, L: L.length, R: R.length, Lmin: mins(L), Rmin: mins(R), sleepMin, lastFeed, lastWet, lastDirty, days };
}

      <tr class="avg"><td>${esc(t('doc_avg'))}</td><td>${avg(s => s.feeds)}</td><td>${avg(s => s.wet)}</td><td>${avg(s => s.dirty)}</td><td>${avg(s => s.breastMin)}</td><td>${sleepDays.length ? (sleepDays.reduce((a, s) => a + s.sleepMin, 0) / sleepDays.length / 60).toFixed(1) : '—'}</td></tr></tbody></table></div>
    ${d.days.some(s => s.backfill) ? `<p class="src">${esc(t('doc_backfill'))}</p>` : ''}
  </section>`;
}
function doctorText(){
  const d = doctorData(); const today = G.todayKey();
  const lines = [];
  lines.push('Gonzalo Bedoya · ' + G.fmtDateLong(today, lang) + ' · ' + ageString(today, true));
  const lastLine = e => e ? fmtT(e.s) + (G.dayKey(e.s) !== today ? ' (' + G.fmtDateShort(G.dayKey(e.s), lang) + ')' : '') + (e.t === 'feed' ? ' ' + evLabel(e).replace(t('breast') + ' · ', '') : '') : t('doc_none');
  lines.push(t('doc_lastFeed') + ': ' + lastLine(d.lastFeed));
  lines.push(t('doc_lastWet') + ': ' + lastLine(d.lastWet));
  lines.push(t('doc_lastDirty') + ': ' + lastLine(d.lastDirty));
  lines.push('');
  lines.push(t('doc_24h').toUpperCase());
  lines.push(t('doc_feeds') + ': ' + d.feeds + ' · ' + d.nursing + ' ' + t('doc_nursing') + ' (' + Math.round(d.nurseMin) + ' ' + t('min') + ') · ' + d.bottles + ' ' + t('doc_bottle') + (d.bottleMl ? ' (' + G.units.vol(d.bottleMl, G.prefs.vol) + ')' : ''));
  lines.push(t('doc_wet') + ': ' + d.wet + ' · ' + t('doc_dirty') + ': ' + d.dirty);
  lines.push(t('doc_stretch') + ': ' + (d.gap != null ? fmtD(d.gap) : '—'));
  lines.push(t('doc_sides') + ': ' + d.L + ' L (' + Math.round(d.Lmin) + ' ' + t('min') + ') · ' + d.R + ' R (' + Math.round(d.Rmin) + ' ' + t('min') + ')');
  if (d.sleepMin) lines.push(t('doc_sleep') + ': ' + fmtD(d.sleepMin));
  lines.push('');
  lines.push(t('doc_7d').toUpperCase());
  const padR = (s, n) => String(s).padStart(n);
  lines.push(padR(t('doc_day'), 7) + padR(t('doc_feeds'), 7) + padR(t('pat_wet'), 6) + padR(t('pat_dirty'), 7) + padR(t('min'), 5));
  for (const s of d.days) lines.push(padR(dayLabel(s.k), 7) + padR(s.feeds || (s.k === today ? '—' : 0), 7) + padR(s.wet, 6) + padR(s.dirty, 7) + padR(Math.round(s.breastMin) || '—', 5));
  const past = d.days.filter(s => s.k !== today && (s.feeds || s.diapers || s.backfill));
  const avg = f => past.length ? (past.reduce((a, s) => a + f(s), 0) / past.length).toFixed(1) : '—';
  lines.push(padR(t('doc_avg'), 7) + padR(avg(s => s.feeds), 7) + padR(avg(s => s.wet), 6) + padR(avg(s => s.dirty), 7) + padR(avg(s => s.breastMin), 5));
  const gl = G.growthList();
  if (gl.length){ lines.push(''); lines.push(t('doc_growth') + ':'); for (const m of gl.slice(-3)){ const b = []; if (m.w != null) b.push(G.units.wt(m.w, G.prefs.wt) + ' (' + t('g_pct', { p: G.fmtPct(G.percentile('wfa', m.w, G.ageDaysAt(m.d)).p, lang) }) + ')'); if (m.l != null) b.push(G.units.len(m.l, G.prefs.len)); if (m.h != null) b.push(t('g_head').toLowerCase() + ' ' + G.units.len(m.h, G.prefs.len)); lines.push('  ' + G.fmtDateShort(m.d, lang) + ': ' + b.join(' · ')); } }
  const vax = G.state.data.health.vax || {}; const given = []; for (const g of C.VAX) for (const v of g.items) if (vax[v.id]) given.push(L(v.name) + ' (' + G.fmtDateShort(vax[v.id].d, lang) + ')');
  lines.push(''); lines.push(t('doc_vax') + ': ' + (given.length ? given.join(', ') : t('doc_none')));
  return lines.join('\n');
}

    <div class="field"><label>${esc(t('f_type'))}</label><div class="seg full">${['wet', 'dirty', 'both', 'dry'].map(s => `<button type="button" data-act="segpick" data-name="sub" data-v="${s}" aria-pressed="${(e ? e.sub : 'wet') === s}">${esc(t('d_' + s))}</button>`).join('')}</div><input type="hidden" name="sub" value="${e ? e.sub || 'wet' : 'wet'}"></div>
    ${timeField('s', t('f_time'), e ? e.s : Date.now(), true)}${noteField(e && e.n)}</form>${sheetFooter(e && e.id)}`);
}
function openSleepEdit(e){
  openSheet(`<h2>${esc(t('sh_sleep'))}</h2><form data-kind="sleep" data-id="${esc(e.id)}">${timeField('s', t('f_start'), e.s, true)}${timeField('e', t('f_end') + (e.e == null ? ' (' + t('f_stillRunning') + ')' : ''), e.e, false)}${noteField(e.n)}</form>${sheetFooter(e.id)}`);

function openBreastEdit(e){
  openSheet(`<h2>${esc(t('sh_breast'))}</h2><form data-kind="breast" data-id="${esc(e.id)}">
    <div class="field"><label>${esc(t('f_side'))}</label><div class="seg full">${['L', 'R'].map(s => `<button type="button" data-act="segpick" data-name="sub" data-v="${s}" aria-pressed="${e.sub === s}">${esc(t('side_' + s))}</button>`).join('')}</div><input type="hidden" name="sub" value="${e.sub}"></div>
    ${timeField('s', t('f_start'), e.s, true)}${timeField('e', t('f_end') + (e.e == null ? ' (' + t('f_stillRunning') + ')' : ''), e.e, false)}${noteField(e.n)}</form>${sheetFooter(e.id)}`);
}
function openCare(sub, e){
  const kinds = ['vitd', 'tummy', 'bath', 'temp', 'meds', 'note', 'solids'];
  const cur = sub || (e && (e.t === 'feed' ? 'solids' : e.sub)) || 'vitd';
  const extra = k => k === 'tummy' ? `<div class="field"><label>${esc(t('f_minutes'))}</label><input type="number" inputmode="numeric" name="a" value="${e && e.a != null ? e.a : 5}" min="0" max="180"></div>`
    : k === 'temp' ? `<div class="field"><label>${esc(t('c_temp'))} (°${G.prefs.temp})</label><input type="number" step="0.1" inputmode="decimal" name="a" value="${e && e.a != null ? (G.prefs.temp === (e.u || 'F') ? e.a : (G.prefs.temp === 'C' ? ((e.a - 32) * 5 / 9).toFixed(1) : (e.a * 9 / 5 + 32).toFixed(1))) : (G.prefs.temp === 'C' ? '36.8' : '98.2')}"></div>` : '';
  openSheet(`<h2>${esc(t('sh_care'))}</h2><form data-kind="care" data-id="${e ? esc(e.id) : ''}">
    <div class="field"><label>${esc(t('f_type'))}</label><div class="presets" id="carekinds">${kinds.map(k => `<button type="button" data-act="carekind" data-v="${k}" aria-pressed="${k === cur}" style="${k === cur ? 'background:var(--accent);color:var(--accent-ink);border-color:var(--accent)' : ''}">${esc(k === 'solids' ? t('solids') : t('c_' + k))}</button>`).join('')}</div><input type="hidden" name="sub" value="${cur}"></div>
    <div id="careextra">${extra(cur)}</div>
    ${timeField('s', t('f_time'), e ? e.s : Date.now(), true)}${noteField(e && e.n)}</form>${sheetFooter(e && e.id)}`);
  ui.sheet._extra = extra;
}
function openEdit(e){
  if (e.t === 'feed' && (e.sub === 'L' || e.sub === 'R')) return openBreastEdit(e);
  if (e.t === 'feed' && e.sub === 'bottle') return openBottle(e);
  if (e.t === 'feed') return openCare('solids', e);
  if (e.t === 'sleep') return openSleepEdit(e);
  if (e.t === 'diaper') return openDiaper(e);
  if (e.t === 'pump') return openPump(e);
  return openCare(e.sub, e);
}
function findEvent(id){ for (const k of Object.keys(G.state.data.days)){ const d = G.state.data.days[k]; if (d && d.ev && d.ev[id]) return d.ev[id]; } return null; }
async function saveSheetForm(){
  const form = ui.sheet && ui.sheet.querySelector('form'); if (!form) return;
  const kind = form.dataset.kind, id = form.dataset.id;
  const old = id ? findEvent(id) : null;
  const f = n => form.elements[n];
  const s = G.msFromInput(f('s') && f('s').value);
  if (s == null){ f('s').focus(); return; }
  let e = old ? Object.assign({}, old) : { id: G.uid(), c: Date.now() };
  e.by = old ? (old.by || G.prefs.who || '') : (G.prefs.who || '');
  e.s = s; e.n = (f('n') && f('n').value.trim()) || '';
  if (kind === 'bottle'){ e.t = 'feed'; e.sub = 'bottle'; const a = parseFloat(f('a').value); e.a = isNaN(a) ? null : Math.round(G.units.toMl(a, G.prefs.vol)); e.u = 'ml'; e.e = null; }
  else if (kind === 'pump'){ e.t = 'pump'; e.sub = f('sub').value; const a = parseFloat(f('a').value); e.a = isNaN(a) ? null : Math.round(G.units.toMl(a, G.prefs.vol)); e.u = 'ml'; e.e = G.msFromInput(f('e').value); }
  else if (kind === 'diaper'){ e.t = 'diaper'; e.sub = f('sub').value; e.e = null; }
  else if (kind === 'sleep'){ e.t = 'sleep'; e.e = G.msFromInput(f('e').value); }
  else if (kind === 'breast'){ e.t = 'feed'; e.sub = f('sub').value; e.e = G.msFromInput(f('e').value); }
  else if (kind === 'care'){
    const sub = f('sub').value;
    if (sub === 'solids'){ e.t = 'feed'; e.sub = 'solids'; e.a = null; e.e = null; }
    else { e.t = 'care'; e.sub = sub; e.e = null; const a = f('a') ? parseFloat(f('a').value) : NaN; e.a = isNaN(a) ? null : a; e.u = sub === 'temp' ? G.prefs.temp : (sub === 'tummy' ? 'min' : null); }
  }
  if (e.e != null && e.e < e.s){ const [a, b] = [e.e, e.s]; e.s = a; e.e = b; }
  closeSheet();
  if (old) await G.moveEvent(old, e); else await G.putEvent(e);
  toast(t(old ? 'saved' : 'logged', { x: evLabel(e) }));
}

/* ---------------- quick actions ---------------- */
async function quickDiaper(sub){
  const e = { id: G.uid(), t: 'diaper', sub, s: Date.now(), e: null, a: null, n: '', by: G.prefs.who || '', c: Date.now() };
  await G.putEvent(e);
  const acts = [{ label: t('undo'), fn: () => G.deleteEvent(e) }];
  if (sub !== 'both') acts.unshift({ label: t('d_both'), fn: () => G.putEvent(Object.assign({}, e, { sub: 'both' })) });
  toast(t('logged', { x: t('d_' + sub) }), acts);
}
async function toggleBreast(side){
  const running = G.runningEvents().filter(e => e.t === 'feed');
  const now = Date.now();
  for (const r of running){ await G.putEvent(Object.assign({}, r, { e: now })); if (r.sub === side){ toast(t('saved')); return; } }
  await G.putEvent({ id: G.uid(), t: 'feed', sub: side, s: now, e: null, a: null, n: '', by: G.prefs.who || '', c: now });
}
async function toggleSleep(){
  const r = G.runningEvents().find(e => e.t === 'sleep');
  const now = Date.now();
  if (r){ await G.putEvent(Object.assign({}, r, { e: now })); toast(t('saved')); return; }
  await G.putEvent({ id: G.uid(), t: 'sleep', s: now, e: null, a: null, n: '', by: G.prefs.who || '', c: now });
}
async function togglePump(){
  const r = G.runningEvents().find(e => e.t === 'pump');
  if (r) return openPump(r);
  await G.putEvent({ id: G.uid(), t: 'pump', sub: 'both', s: Date.now(), e: null, a: null, n: '', by: G.prefs.who || '', c: Date.now() });
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast(t('copied')); }
  catch (e){ const ta = $('#sharetext'); if (ta){ ta.select(); try { document.execCommand('copy'); toast(t('copied')); } catch (e2){} } }
}

/* ---------------- events ---------------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'scrim'){ if (ev.target === el) closeSheet(); return; }
  if (el.tagName === 'A') return;
  if (act !== 'ms' && act !== 'vax' && act !== 'visit') ev.preventDefault();
  const ro = G.state.mode === 'readonly' || G.state.mode === 'connecting';
  const writes = ['breast', 'bottle', 'sleep', 'diaper', 'pump', 'more', 'ev-save', 'ev-del', 'ms', 'vax', 'visit', 'gsave', 'gdel', 'care'];
  if (ro && writes.includes(act) && G.state.mode === 'readonly'){ toast(t('ro_banner')); return; }
  switch (act){
    case 'tab': ui.tab = v; showTab(); break;
    case 'lang': setLang(v); break;
    case 'who': openWho(false); break;
    case 'who-pick': G.prefs.who = v; G.savePrefs(); closeSheet(); renderHeader(); break;
    case 'who-save': { const n = ($('#whoname') && $('#whoname').value.trim()); if (n){ G.prefs.who = n; G.savePrefs(); const cg = G.state.data.profile.caregivers || []; if (!cg.includes(n)) await G.putProfile({ caregivers: cg.concat([n]) }); } else if (!G.prefs.who) return; closeSheet(); renderHeader(); break; }
    case 'settings': openSettings(); break;
    case 'pref': { if (el.dataset.name === 'lang') setLang(v); else { G.prefs[el.dataset.name] = v; G.savePrefs(); renderAll(); } openSettings(); break; }
    case 'addcg': { const n = $('#newcg').value.trim(); if (!n) return; const cg = G.state.data.profile.caregivers || []; if (!cg.includes(n)) await G.putProfile({ caregivers: cg.concat([n]) }); openSettings(); break; }
    case 'merge': { const n = await G.mergeLocalIntoShared(); toast(t('s_merged', { n })); break; }
    case 'breast': toggleBreast(v); break;
    case 'bottle': openBottle(null); break;
    case 'sleep': toggleSleep(); break;
    case 'diaper': quickDiaper(v); break;
    case 'pump': togglePump(); break;
    case 'more': openCare(null, null); break;
    case 'care': openCare(v, null); break;
    case 'edit': { const e = findEvent(el.dataset.id); if (e) openEdit(e); break; }
    case 'sheet-close': closeSheet(); break;
    case 'ev-save': saveSheetForm(); break;
    case 'ev-del': { const e = findEvent(el.dataset.id); closeSheet(); if (e){ await G.deleteEvent(e); toast(t('deleted'), [{ label: t('undo'), fn: () => G.putEvent(Object.assign({}, e, { del: false })) }]); } break; }
    case 'segpick': { const form = el.closest('form'); form.elements[el.dataset.name].value = v; $$('[data-act=segpick][data-name=' + el.dataset.name + ']', form).forEach(b => b.setAttribute('aria-pressed', String(b === el))); break; }
    case 'carekind': { const form = el.closest('form'); form.elements.sub.value = v; $$('[data-act=carekind]', form).forEach(b => { const on = b === el; b.setAttribute('aria-pressed', String(on)); b.style.cssText = on ? 'background:var(--accent);color:var(--accent-ink);border-color:var(--accent)' : ''; }); $('#careextra').innerHTML = ui.sheet._extra(v); break; }
    case 'step': { const inp = el.parentElement.querySelector('input'); inp.value = Math.max(0, Math.round(((parseFloat(inp.value) || 0) + parseFloat(v)) * 10) / 10); break; }
    case 'preset': { const inp = el.closest('.field').querySelector('input[name=a]'); inp.value = v; break; }
    case 'toastact': { const a = $('#toast')._actions[+el.dataset.i]; $('#toast').hidden = true; if (a) a.fn(); break; }
    case 'sync-copy': openSyncCopy(3, false); break;
    case 'sync-link': openSyncCopy(3, true); break;
    case 'sync-range': openSyncCopy(v === 'all' ? 'all' : +v, el.dataset.link === '1'); break;
    case 'sync-paste': openSyncPaste(); break;
    case 'sync-clip': { try { const txt = await navigator.clipboard.readText(); if (!txt || !txt.trim()) throw new Error('empty'); const ta = $('#synctext'); if (ta) ta.value = txt; const r = await G.importSync(txt); closeSheet(); toast(t('sync_done', { a: r.added, u: r.updated, from: r.from ? t('sync_from', { who: r.from }) : '' })); } catch (e) { toast(e && e.message === 'format' ? t('sync_bad') : t('sync_pasteFail')); } break; }
    case 'sync-merge': { const txt = ($('#synctext') && $('#synctext').value) || ''; if (!txt.trim()) return; try { const r = await G.importSync(txt); closeSheet(); toast(t('sync_done', { a: r.added, u: r.updated, from: r.from ? t('sync_from', { who: r.from }) : '' })); } catch (e) { toast(t('sync_bad')); } break; }
    case 'logview': ui.logView = v; renderLog(); break;
    case 'patrange': ui.patRange = +v; renderLog(); break;
    case 'doc-copy': openDoctorCopy(); break;
    case 'logday': { const nk = G.addDays(ui.logDay, +v); if (nk <= G.todayKey() && nk >= G.PROFILE.dobKey) { ui.logDay = nk; renderLog(); } break; }
    case 'share': openShare(); break;
    case 'share-copy': copyText($('#sharetext').value); break;
    case 'share-native': { try { await navigator.share({ text: $('#sharetext').value }); } catch (e){} break; }
       case 'export': { const data = G.csvExport(); const name = 'gonzalo-days-' + G.todayKey() + '.csv'; if (!G.state.downloads){ openTextFile(name, data); break; } const r = await G.saveFile(name, data); if (r === 'saved') toast(t('saved')); break; }
       case 'backup': { const data = JSON.stringify(G.state.data, null, 1); const name = 'gonzalo-days-backup-' + G.todayKey() + '.json'; if (!G.state.downloads){ openTextFile(name, data); break; } const r = await G.saveFile(name, data); if (r === 'saved') toast(t('saved')); break; }
    case 'gm': ui.gMeasure = v; renderGrowth(); break;
    case 'gr': ui.gRange = +v; renderGrowth(); break;
    case 'gt': ui.gTable = v === '1'; renderGrowth(); break;
    case 'gedit': { const m = G.state.data.growth.m[el.dataset.id]; if (m) openGrowthEdit(m); break; }
    case 'gsave': { const form = ui.sheet.querySelector('form') || ui.sheet; const g = n => ui.sheet.querySelector('[name=' + n + ']').value; const old = G.state.data.growth.m[el.dataset.id]; const m = Object.assign({}, old, { d: g('d') || old.d, w: g('w') ? Math.round(G.units.toKg(+g('w'), G.prefs.wt) * 1000) / 1000 : null, l: g('l') ? Math.round(G.units.toCm(+g('l'), G.prefs.len) * 10) / 10 : null, h: g('h') ? Math.round(G.units.toCm(+g('h'), G.prefs.len) * 10) / 10 : null }); closeSheet(); await G.putGrowth(m); toast(t('saved')); break; }
    case 'gdel': { const old = G.state.data.growth.m[el.dataset.id]; closeSheet(); if (old){ await G.putGrowth(Object.assign({}, old, { del: true })); toast(t('deleted')); } break; }
    case 'gband': ui.guideBand = +v; if (C.GUIDE[ui.guideBand] === C.bandFor(G.ageDays())) ui.guideBand = null; renderGuide(); break;
    case 'ms': { const on = el.checked; await G.putHealth('ms', el.dataset.id, { on, by: G.prefs.who || '', d: G.todayKey() }); break; }
    case 'vax': { ev.preventDefault(); openVax(el.dataset.id); break; }
    case 'vax-save': { const d = ui.sheet.querySelector('[name=d]').value; if (!d) return; const where = ui.sheet.querySelector('[name=where]').value.trim(); closeSheet(); await G.putHealth('vax', el.dataset.id, { d, where, by: G.prefs.who || '' }); toast(t('saved')); break; }
    case 'vax-clear': closeSheet(); await G.putHealth('vax', el.dataset.id, null); break;
    case 'visit': { ev.preventDefault(); openVisit(el.dataset.id); break; }
    case 'visit-save': { const d = ui.sheet.querySelector('[name=d]').value; if (!d) return; const n = ui.sheet.querySelector('[name=n]').value.trim(); closeSheet(); await G.putHealth('visits', el.dataset.id, { d, n, by: G.prefs.who || '' }); toast(t('saved')); break; }
    case 'visit-clear': closeSheet(); await G.putHealth('visits', el.dataset.id, null); break;
    case 'ped': openPed(); break;
    case 'ped-save': { const g = n => ui.sheet.querySelector('[name=' + n + ']').value.trim(); const ped = { name: g('name'), phone: g('phone'), notes: g('notes') }; closeSheet(); G.state.data.health.ped = ped; G.emit(); await G.putHealth('ped', 'name', ped.name); await G.putHealth('ped', 'phone', ped.phone); await G.putHealth('ped', 'notes', ped.notes); toast(t('saved')); break; }
    case 'askpreset': { $('#askq').value = t(v); ask(t(v)); break; }
    case 'ask': ask($('#askq').value.trim()); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheet) closeSheet(); if (ev.key === 'Enter' && ui.sheet && ev.target.tagName === 'INPUT' && ev.target.type !== 'file'){ const btn = ui.sheet.querySelector('[data-act=ev-save],[data-act=gsave],[data-act=vax-save],[data-act=visit-save],[data-act=ped-save],[data-act=who-save]'); if (btn){ ev.preventDefault(); btn.click(); } } });
document.addEventListener('submit', ev => { if (ev.target.closest('.sheet')) ev.preventDefault(); });

/* ---------------- render orchestration ---------------- */
function showTab(){
  for (const k of ['today', 'log', 'growth', 'guide', 'health']){ $('#p-' + k).hidden = ui.tab !== k; }
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === ui.tab)));
  renderTab();
  window.scrollTo({ top: 0 });
}
function renderTab(){
  if (ui.tab === 'today') renderToday();
  else if (ui.tab === 'log') renderLog();
  else if (ui.tab === 'growth') renderGrowth();
  else if (ui.tab === 'guide') renderGuide();
  else renderHealth();
}
let raf = null;
function renderAll(){ if (raf) return; raf = requestAnimationFrame(() => { raf = null; renderHeader(); renderTab(); }); }
function setLang(v){ lang = v; G.prefs.lang = v; G.savePrefs(); document.documentElement.lang = v; renderShell(); showTab(); }
function tick(){
  const now = Date.now();
  $$('[data-elapsed]').forEach(el => { el.textContent = G.fmtClock(now - (+el.dataset.elapsed)); });
  $$('[data-ago]').forEach(el => { el.textContent = fmtD((now - (+el.dataset.ago)) / 60000); });
  $$('[data-hm]').forEach(el => { el.textContent = fmtHM((now - (+el.dataset.hm)) / 60000); });
}
let lastMinute = -1;
setInterval(() => {
  tick();
  const m = Math.floor(Date.now() / 60000);
  if (m !== lastMinute){ lastMinute = m; if (ui.tab === 'today' && !ui.sheet){ const ns = $('#nowstrip'); if (ns) ns.innerHTML = nowTilesHTML(); const hh = $('#hero'); if (hh){ hh.classList.remove('nursing'); hh.innerHTML = heroHTML(); } const rb = $('#ribbon-today'); if (rb) renderRibbon(rb, G.todayKey()); } if (G.todayKey() !== ui._day){ ui._day = G.todayKey(); renderAll(); } }
}, 1000);
window.addEventListener('resize', () => { clearTimeout(ui._rt); ui._rt = setTimeout(() => { if (ui.tab === 'today'){ const r = $('#ribbon-today'); if (r) renderRibbon(r, G.todayKey()); } else if (ui.tab === 'log'){ if (ui.logView === 'patterns') renderLog(); else { const r = $('#ribbon-log'); if (r) renderRibbon(r, ui.logDay); } } else if (ui.tab === 'growth'){ const g = $('#gchart'); if (g && !ui.gTable) renderGrowthChart(g, ui.gMeasure, ui.gRange); } }, 150); });

/* ---------------- init ---------------- */
document.documentElement.lang = lang;
ui._day = G.todayKey();
renderShell();
showTab();
G.onChange(renderAll);
G.boot().then(async () => {
  renderAll();
  const linked = await G.consumeLinkPayload();
  if (linked && (linked.added || linked.updated)){ renderAll(); toast(t('sync_done', { a: linked.added, u: linked.updated, from: linked.from ? t('sync_from', { who: linked.from }) : '' })); }
  if (!G.prefs.who) openWho(true);
});
})();

</script>
